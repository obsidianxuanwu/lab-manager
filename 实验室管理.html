<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#1a5fb4;--blue-d:#14488a;--blue-l:#e8f0fb;
  --green:#1a7f37;--green-bg:#e6f4ea;--green-bd:#a8d5b5;
  --red:#b42318;--red-bg:#fdecea;--red-bd:#f5c6c2;
  --amber:#b54708;--amber-bg:#fff4e5;--amber-bd:#f5d5a8;
  --gray:#5c6470;--gray-l:#98a2b3;--line:#e3e6ea;--bg:#f4f6f8;
  --safe-b:env(safe-area-inset-bottom,0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:#1c1f23;font-size:16px;line-height:1.55;
}
header{
  background:linear-gradient(135deg,#1a5fb4 0%,#14488a 100%);
  color:#fff;padding:16px 18px;position:sticky;top:0;z-index:40;
  box-shadow:0 3px 14px rgba(16,24,40,.18);
}
.hd{display:flex;align-items:center;gap:14px;max-width:1240px;margin:0 auto}
/* 学院 logo：圆形，带白色描边，在蓝色渐变底上更清楚 */
.hd .logo{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;display:block;
  background:#fff;padding:2px;box-sizing:border-box;
  box-shadow:0 2px 6px rgba(0,0,0,.22);
}
.hd h1{
  font-size:26px;font-weight:700;letter-spacing:1.2px;flex-shrink:0;
  text-shadow:0 1px 2px rgba(0,0,0,.16);line-height:1.25;
}
.hd .sub{
  font-size:13px;opacity:.88;margin-left:auto;text-align:right;
  background:rgba(255,255,255,.14);border-radius:20px;padding:5px 14px;white-space:nowrap;
}
/* 进了某个实验室后：大标题仍是系统名，右侧徽章变成"203 智能科学实验室" */
.hd .sub.lab{
  background:rgba(255,255,255,.24);font-weight:600;font-size:14.5px;
  border-radius:10px;padding:7px 16px;letter-spacing:.4px;
}
.hd .sub.lab .lb-no{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:700;margin-right:7px}
.back{
  border:0;background:rgba(255,255,255,.2);color:#fff;font-size:14.5px;font-family:inherit;
  border-radius:9px;padding:8px 15px;cursor:pointer;flex-shrink:0;font-weight:500;
}
.back:hover{background:rgba(255,255,255,.32)}
main{max-width:1240px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.07)}
.card>h2{font-size:15.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2::before{content:'';width:4px;height:16px;background:var(--blue);border-radius:2px;flex-shrink:0}
.card>h2 .hint{font-size:12.5px;font-weight:400;color:var(--gray-l);margin-left:auto}
.alert{background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--amber)}
.alert.r{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.alert .t{font-weight:600;margin-bottom:6px}
.alert ul{margin:0;padding-left:19px}
.alert li{margin:3px 0;line-height:1.5}
.alert li b{font-weight:600}
/* 实验室列表 */
.lab{display:flex;align-items:center;gap:13px;padding:14px;background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(16,24,40,.07);cursor:pointer;border-left:4px solid var(--blue)}
.lab:hover{background:#fafbfc}
.lab .no{min-width:74px;height:46px;border-radius:9px;background:var(--blue-l);color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;font-family:ui-monospace,Menlo,monospace;flex-shrink:0}
.lab .info{flex:1;min-width:0}
.lab .nm{font-size:15.5px;font-weight:600}
.lab .dt{font-size:12.5px;color:var(--gray);margin-top:3px}
.lab .dt .sep{margin:0 6px;color:#cfd6dd}
.lab .tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;white-space:nowrap;font-weight:500}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.b{background:var(--blue-l);color:var(--blue-d)}
.tag.gy{background:#eef0f3;color:var(--gray)}
/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:#f7f9fb;color:var(--gray);font-weight:600;font-size:12.5px;white-space:nowrap}
td.num{font-family:ui-monospace,Menlo,monospace}
tr.group-row td{background:#fafbfc}
tr.sub-row td:first-child{color:var(--gray-l)}
td[contenteditable="true"],th[contenteditable="true"]{background:#fffdf5;outline:none;cursor:text;min-width:60px}
td[contenteditable="true"]:focus{background:#fff8e1;box-shadow:inset 0 0 0 2px var(--blue)}
.del{border:0;background:none;color:var(--red);font-size:17px;cursor:pointer;padding:0 4px;line-height:1;font-family:inherit}
.del:hover{opacity:.7}
.sect{margin-bottom:20px}
.sect:last-child{margin-bottom:0}
.sect-h{font-size:14.5px;font-weight:600;color:#3d4551;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.sect-h .add{margin-left:auto}
/* 按钮 */
.btn{border:0;border-radius:9px;padding:9px 15px;font-size:14px;font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;font-weight:500}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#eef1f5;color:#3d4551}
.btn.ghost:hover{background:#e3e8ee}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff1f0;color:var(--red);border:1px solid var(--red-bd)}
.btn.danger:hover{background:#ffe4e1}
.row-btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
/* 报修 */
.rep{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:10px}
.rep.pending{border-left:4px solid var(--amber)}
.rep.open{border-left:4px solid var(--red)}
.rep.done{border-left:4px solid var(--green-bd);opacity:.75}
.rep-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.rep-h .m{font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.rep-h .tm{font-size:12.5px;color:var(--gray-l);margin-left:auto}
.rep-q{font-size:14.5px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
/* 报修问题多选：两列卡片式勾选 */
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:10px}
.rp-item{display:flex;align-items:center;gap:8px;font-size:14px;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fff;
  line-height:1.3;user-select:none}
.rp-item:hover{background:#f7fbff;border-color:#c9d8ea}
.rp-item input{width:17px;height:17px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;margin:0}
.rp-item.on{background:var(--blue-l);border-color:var(--blue);font-weight:600;color:var(--blue-d)}
@media(max-width:520px){ .rp-grid{grid-template-columns:1fr} }
.rp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rp-tag{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:20px;
  background:#eef1f5;color:#3d4551;font-weight:500}
.rp-tag.other{background:var(--amber-bg);color:var(--amber)}
.rep-s{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px}
.rep-s label{display:flex;align-items:center;gap:6px;cursor:pointer}
.rep-s input{width:17px;height:17px;cursor:pointer;accent-color:var(--blue)}
label.f{display:block;margin-bottom:11px}
label.f .k{display:block;font-size:13px;color:var(--gray);margin-bottom:5px}
input[type=text],input[type=date],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;
  font-size:14.5px;font-family:inherit;background:#fff;color:#1c1f23;outline:none;
}
textarea{line-height:1.6;resize:vertical;min-height:74px}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,95,180,.1)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;padding:34px 16px;color:var(--gray-l);font-size:14.5px}
.mask{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.dlg{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
.dlg h3{font-size:17px;margin-bottom:4px}
.dlg .st{font-size:13px;color:var(--gray);margin-bottom:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,10px);background:rgba(28,31,35,.94);color:#fff;font-size:14px;padding:11px 20px;border-radius:24px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
pre.prev{background:#f7f9fb;border-radius:8px;padding:11px;font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-all;margin-top:8px}
.pick{background:#f7f9fb;border-radius:9px;padding:11px;margin-bottom:9px;font-size:13.5px}
.pick .ok{color:var(--green);font-weight:600}
.pick .bad{color:var(--red);font-weight:600}
.muted{color:var(--gray-l);font-size:12.5px}
/* ---- 模块二：日程总表 / 课表 ---- */
.mx-ctl{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.mx-ctl .lb{font-size:13px;color:var(--gray)}
.mx-ctl input[type=number]{width:74px;height:38px;text-align:center;font-size:15px;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.step{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:18px;cursor:pointer;font-family:inherit;color:#3d4551;line-height:1}
.step:hover{background:#f2f5f8}
.mx-days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.day-btn{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px;font-size:13.5px;cursor:pointer;font-family:inherit;color:#3d4551;display:flex;flex-direction:column;align-items:center;gap:2px}
.day-btn .d{font-size:11px;color:var(--gray-l)}
.day-btn:hover{background:#f2f5f8}
.day-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.day-btn.on .d{color:rgba(255,255,255,.8)}
.day-btn.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px}
table.mx{border-collapse:separate;border-spacing:3px;width:100%;min-width:720px}
table.mx thead th{background:#f7f9fb;color:var(--gray);font-size:12.5px;font-weight:600;padding:7px 6px;text-align:center;white-space:nowrap;border-radius:8px}
table.mx thead th.today{background:var(--blue-l);color:var(--blue-d)}
table.mx thead th .d{display:block;font-size:10.5px;font-weight:400;color:var(--gray-l);margin-top:1px}
table.mx th.corner{width:66px;background:transparent}
table.mx th.labcol{cursor:grab;min-width:132px;user-select:none}
table.mx th.labcol .no{display:block;font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;color:#1c1f23}
table.mx th.labcol .nm{display:block;font-size:11.5px;font-weight:400;color:var(--gray);margin-top:1px}
table.mx th.labcol.dragging{opacity:.4}
table.mx th.labcol.dropzone{box-shadow:inset 0 0 0 2px var(--blue)}
table.mx th.rowh{width:66px;text-align:right;font-size:12px;font-weight:600;color:#3d4551;background:transparent;white-space:nowrap;padding-right:4px}
table.mx td.cell{padding:6px;vertical-align:top;border-radius:8px}
table.mx td.cell.free{background:#f7f9fb;border:1px dashed #dfe4ea;text-align:center}
table.mx td.cell.free .free-t{font-size:12px;color:#c2cad3}
table.mx td.cell.busy{background:var(--red-bg);cursor:pointer}
table.mx td.cell.busy:hover{outline:2px solid #f0b4ae}
table.mx .one{padding:2px 0}
table.mx .one + .one{border-top:1px dashed #f0b4ae;margin-top:4px;padding-top:5px}
table.mx .c1{font-size:12.5px;font-weight:700;color:var(--red);line-height:1.35;word-break:break-word}
table.mx .c2{font-size:11.5px;color:#8a4a44;margin-top:2px;word-break:break-word}
table.mx .c3{font-size:10.5px;color:#9c6a65;margin-top:1px;font-family:ui-monospace,Menlo,monospace}
table.mx.sched td.cell.free{background:var(--green-bg);border:1px dashed var(--green-bd)}
table.mx.sched td.cell.free .free-t{color:var(--green)}
.cd{background:#f7f9fb;border-radius:10px;padding:11px 13px;margin-bottom:9px}
.cd-t{font-size:15px;font-weight:600;margin-bottom:6px}
.cd-l{font-size:13.5px;color:#3d4551;margin:2px 0}
.cd-l b{display:inline-block;min-width:56px;color:var(--gray);font-weight:500}
.vtabs{display:flex;gap:7px;margin-bottom:12px}
.vtabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;font-size:14.5px;cursor:pointer;font-family:inherit;color:#3d4551;font-weight:500}
.vtabs button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.ltab{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.ltab button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 15px;font-size:14px;cursor:pointer;font-family:inherit;color:#3d4551}
.ltab button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.editmode-lab{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--gray);
  border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.editmode-lab:hover{background:#f2f5f8}
.editmode-lab input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
/* 文件选择：原生 input 又小又不显眼，包成明显的按钮 */
.filebox{border:2px dashed #c3cdd8;border-radius:12px;padding:20px 16px;text-align:center;background:#fafbfc;cursor:pointer;display:block;margin-bottom:4px}
.filebox:hover{border-color:var(--blue);background:#f4f8fd}
.filebox .fi{font-size:26px;line-height:1;margin-bottom:7px}
.filebox .ft{font-size:15px;font-weight:600;color:var(--blue-d)}
.filebox .fs{font-size:12.5px;color:var(--gray-l);margin-top:4px}
.filebox input{display:none}
.card-btns{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#fff;color:var(--blue-d);font-size:12.5px;font-family:inherit;
      padding:6px 11px;border-radius:8px;cursor:pointer;min-height:32px}
.mini:hover{background:var(--blue-l);border-color:var(--blue)}
.mini.warn{color:var(--amber);border-color:var(--amber-bd);background:var(--amber-bg)}
.mini.warn:hover{background:#ffe9cc}
.nocourse{color:var(--amber);font-size:12.5px}
td.rowbtns{white-space:nowrap;text-align:center;vertical-align:middle;background:#fcfdfe}
td.rowbtns .mini{padding:4px 9px;min-height:28px;font-size:12px;margin:0 2px}
td.rowbtns .delmini{color:var(--red);border-color:#f0c4c0}
td.rowbtns .delmini:hover{background:#fff1f0}
@media(max-width:600px){
  .two{grid-template-columns:1fr}
  main{padding:11px}
  .lab .no{min-width:62px;font-size:15px}
  header{padding:12px 14px}
  .hd{flex-wrap:wrap;gap:9px}
  .hd h1{font-size:17.5px;letter-spacing:.5px}
  .hd .logo{width:34px;height:34px}
  .hd .sub{font-size:12px;padding:4px 11px;margin-left:0;order:3;width:100%;text-align:left}
}
/* 页脚署名：灰色小字，居中，始终在页面最下方 */
.credit{
  text-align:center;font-size:12px;color:#98a2b3;
  padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));
  line-height:1.9;letter-spacing:.2px;user-select:text;
}
</style>
</head>

   ============================================================ */
function $(s){ return document.querySelector(s); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
var toastTimer;
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('on'); },2200); }
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function save(){
  DB.updated = today();
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存失败：浏览器存储不可用'); }
}
function load(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw){ var d = JSON.parse(raw); if (d && d.labs) return d; }
  } catch(e){}
  return null;
}
function findLab(id){ for (var i=0;i<DB.labs.length;i++) if (DB.labs[i].id===id) return DB.labs[i]; return null; }

/* 报修状态判定 —— 两个状态独立 */
function repPending(r){ return !r.declared && !r.fixed; }   /* 未申报 */
function repOpen(r){ return r.declared && !r.fixed; }       /* 已申报但未修完 */
function repDone(r){ return r.fixed; }                       /* 已修完 */
function repState(r){ return repDone(r)?'done':(repPending(r)?'pending':'open'); }

/* ---------- 报修问题：固定 6 个选项，可多选 ----------
   只有勾选"其他"时才需要填具体描述。
   旧记录只有 problem 自由文本、没有 problems 数组，显示时按原文回退。 */
var REP_PROBLEMS = ['不能上网', '电脑没反应', '屏幕点不亮', '键盘不能用', '鼠标不能用', '其他'];

/* 显示用文字：按固定顺序拼接，不受勾选先后影响 */
function repProblemText(r){
  if (!r) return '';
  var list = (r.problems && r.problems.length) ? r.problems : null;
  if (!list) return String(r.problem || '');          /* 旧记录：原文显示 */
  var note = (r.problemOther || '').trim();
  var parts = [];
  REP_PROBLEMS.forEach(function(p){
    if (list.indexOf(p) < 0) return;
    if (p === '其他') parts.push(note ? ('其他：' + note) : '其他');
    else parts.push(p);
  });
  return parts.join('、');
}

/* 编辑时预选的选项（旧记录归到"其他"） */
function repProblemsForEdit(r){
  if (r && r.problems && r.problems.length) return r.problems.slice();
  if (r && r.problem && String(r.problem).trim()) return ['其他'];
  return [];
}
/* 编辑时"其他"的文本（旧记录用原自由文本回填） */
function repOtherForEdit(r){
  if (!r) return '';
  if (r.problemOther) return r.problemOther;
  if (!(r.problems && r.problems.length) && r.problem) return String(r.problem);
  return '';
}

/* 生成勾选项 HTML。mode='add' 用于新增对话框，'edit' 用于行内编辑 */
function problemChecksHtml(selected, mode, L){
  selected = selected || [];
  return '<div class="rp-grid">' + REP_PROBLEMS.map(function(p){
    var on = selected.indexOf(p) >= 0;
    var handler = (mode === 'edit')
      ? 'rpEditToggle(' + L + ',this.value,this.checked,this)'
      : 'rpToggle(this)';
    return '<label class="rp-item' + (on ? ' on' : '') + '">'
      + '<input type="checkbox" class="rp-cb" value="' + esc(p) + '"' + (on ? ' checked' : '')
      + ' onchange="' + handler + '"> ' + esc(p) + '</label>';
  }).join('') + '</div>';
}

/* 新增对话框：勾选时同步"其他"输入框 */
function rpToggle(el){
  if (el && el.parentNode) el.parentNode.classList.toggle('on', el.checked);
  if (el && el.value === '其他'){
    var wrap = document.getElementById('npOtherWrap');
    if (wrap){
      wrap.style.display = el.checked ? 'block' : 'none';
      if (el.checked){
        setTimeout(function(){ var t = document.getElementById('npOtherText'); if (t) t.focus(); }, 40);
      }
    }
  }
}

/* 行内编辑：勾选后直接存，不重画页面（避免输入框失去焦点） */
function rpEditToggle(labId, repId, label, checked, el){
  var lab = findLab(labId); if (!lab) return;
  var r = (lab.repairs || []).filter(function(x){ return x.id === repId; })[0];
  if (!r) return;
  /* 旧记录首次编辑时迁移为结构化数据 */
  if (!r.problems){
    r.problems = (r.problem && String(r.problem).trim()) ? ['其他'] : [];
    if (!r.problemOther && r.problem) r.problemOther = String(r.problem);
    delete r.problem;
  }
  var i = r.problems.indexOf(label);
  if (checked && i < 0) r.problems.push(label);
  if (!checked && i >= 0) r.problems.splice(i, 1);
  save();
  if (el && el.parentNode) el.parentNode.classList.toggle('on', checked);
  if (label === '其他'){
    var wrap = document.getElementById('rpOtherWrap_' + repId);
    if (wrap){
      wrap.style.display = checked ? 'block' : 'none';
      if (checked){
        setTimeout(function(){ var t = document.getElementById('rpOtherText_' + repId); if (t) t.focus(); }, 40);
      }
    }
  }
}
/* 行内编辑："其他"的描述 */
function rpSetOther(labId, repId, text){
  var lab = findLab(labId); if (!lab) return;
  var r = (lab.repairs || []).filter(function(x){ return x.id === repId; })[0];
  if (!r) return;
  if (!r.problems){
    r.problems = (r.problem && String(r.problem).trim()) ? ['其他'] : [];
    if (!r.problemOther && r.problem) r.problemOther = String(r.problem);
    delete r.problem;
  }
  r.problemOther = String(text || '').trim();
  save();
}

  if (LAB_TAB === 'sched'){
    h += renderLabSchedule(lab);
    $('#app').innerHTML = h;
    return;
  }

  /* 一、硬件配置 */
  h += '<div class="card"><h2>一、硬件配置'
    + (EDIT ? '<span class="hint">点格子直接改</span>' : '')
    + '</h2>'
    + '<div class="tbl-wrap"><table id="tblHW"><thead><tr>'
    + '<th style="width:22%">项目</th><th style="width:34%">配置</th><th style="width:14%">采购年份</th>'
    + '<th style="width:16%">保修状态</th><th style="width:10%">数量</th>'
    + (EDIT ? '<th style="width:4%"></th>' : '') + '</tr></thead><tbody>';
  (lab.hw||[]).forEach(function(r,i){
    h += '<tr>'
      + ed('hw',i,'item',r.item) + ed('hw',i,'config',r.config) + ed('hw',i,'year',r.year)
      + ed('hw',i,'warranty',r.warranty) + ed('hw',i,'qty',r.qty, 'num')
      + rowBtns('hw', i)
      + '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="row-btns">'
    + '<button class="btn ghost sm" onclick="dlgRow(\'hw\',-1)">＋ 添加一行</button>'
    + (EDIT ? '<button class="btn ghost sm" onclick="addRow(\'hw\')">在表格里空加一行</button>' : '')
    + '</div>';
  h += '</div>';

  /* 二、系统环境 */
  h += '<div class="card"><h2>二、系统环境</h2>'
    + '<div class="tbl-wrap"><table><thead><tr>'
    + '<th style="width:28%">项目</th><th>版本/配置</th>'
    + (EDIT ? '<th style="width:5%"></th>' : '') + '</tr></thead><tbody>';
  (lab.env||[]).forEach(function(r,i){
    h += '<tr>' + ed('env',i,'item',r.item) + ed('env',i,'config',r.config)
      + rowBtns('env', i) + '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="row-btns">'
    + '<button class="btn ghost sm" onclick="dlgRow(\'env\',-1)">＋ 添加一行</button>'
    + (EDIT ? '<button class="btn ghost sm" onclick="addRow(\'env\')">在表格里空加一行</button>' : '')
    + '</div>';
  h += '</div>';

  /* 三、软件清单。软件是"这学期装一个、下学期装一个"，所以要能随时单独加/改，
     不必先去主页勾编辑模式。 */
  h += '<div class="card"><h2>三、软件清单<span class="hint">' + (lab.sw||[]).length + ' 个</span></h2>'
    + '<div class="tbl-wrap"><table><thead><tr>'
    + '<th style="width:18%">类别</th><th style="width:34%">软件名称</th>'
    + '<th style="width:16%">版本</th><th>备注</th>'
    + '<th style="width:88px"></th></tr></thead><tbody>';
  if (!(lab.sw||[]).length){
    h += '<tr><td colspan="5" style="text-align:center;color:var(--gray-l);padding:16px">还没有软件，点下面的「＋ 添加软件」</td></tr>';
  }
  (lab.sw||[]).forEach(function(r,i){
    h += '<tr>' + ed('sw',i,'cat',r.cat) + ed('sw',i,'name',r.name) + ed('sw',i,'ver',r.ver) + ed('sw',i,'note',r.note)
      + rowBtns('sw', i) + '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="row-btns">'
    + '<button class="btn" onclick="dlgRow(\'sw\',-1)">＋ 添加软件</button>'
    + (EDIT ? '<button class="btn ghost sm" onclick="addRow(\'sw\')">在表格里空加一行</button>' : '')
    + '</div>';
  h += '</div>';

  /* 报修单 */
  var reps = (lab.repairs||[]).slice().sort(function(a,b){
    var d = repState(b).localeCompare(repState(a));
    return String(b.time||'').localeCompare(String(a.time||''));
  });
  h += '<div class="card"><h2>报修记录<span class="hint">' + reps.length + ' 条</span></h2>';
  if (!reps.length){
    h += '<div class="empty" style="padding:22px">这个实验室还没有报修记录</div>';
  } else {
    reps.forEach(function(r){
      var st = repState(r);
      var cls = st==='done' ? 'done' : (st==='pending' ? 'pending' : 'open');
      var tag = st==='done' ? '<span class="tag g">已维修完毕</span>'
              : (st==='pending' ? '<span class="tag a">未申报</span>' : '<span class="tag r">已申报 · 未修完</span>');
      h += '<div class="rep ' + cls + '" id="rep-' + esc(r.id) + '">'
        + '<div class="rep-h"><span class="m">' + esc(r.machine) + '</span>' + tag
        + '<span class="tm">报修时间 ' + esc(r.time || '未填') + '</span></div>'
        + (EDIT ? edRep(r, lab.id) : '<div class="rep-q">' + esc(repProblemText(r) || '（未填写问题）') + '</div>')
        + (EDIT ? '' : repStatusHtml(r, lab.id))
        + (EDIT ? '<div class="row-btns"><button class="btn danger sm" onclick="delRep(\'' + esc(lab.id) + '\',\'' + esc(r.id) + '\')">删除这条</button></div>' : '')
        + '</div>';
    });
  }
  h += '<div class="row-btns">'
    + '<button class="btn" onclick="dlgAddRep(\'' + esc(lab.id) + '\')">+ 添加报修记录</button>'
    + (reps.length ? '<button class="btn ghost" onclick="exportRepairs(\'' + esc(lab.id) + '\')">导出为 Excel</button>' : '')
    + '</div>';
  if (reps.length){
    h += '<div class="muted" style="margin-top:8px">'
      + '导出会存到「桌面\\报修记录」文件夹里。第一次会弹出窗口让你确认位置，之后默认用同一个；'
      + '想换位置点 <a href="javascript:resetExportDir()" style="color:var(--blue)">这里</a>。'
      + '</div>';
  }
  h += '</div>';

  /* 实验室自身管理 */
  h += '<div class="card"><h2>实验室设置</h2><div class="row-btns">'
    + '<button class="btn ghost" onclick="dlgEditLab(\'' + esc(lab.id) + '\')">改名称 / 编号</button>'
    + '<button class="btn ghost" onclick="dlgImport(\'' + esc(lab.id) + '\')">用 Excel 覆盖配置</button>'
    + '<button class="btn danger" onclick="dlgDelLab(\'' + esc(lab.id) + '\')">删除这个实验室</button>'
    + '</div></div>';

  $('#app').innerHTML = h;
  /* 恢复编辑模式复选框状态。不恢复的话，加一条数据后重画页面，
     "编辑模式"的勾会掉，得重新勾一次 —— 连续加几条时很烦。 */
  var cb = $('#editMode'); if (cb) cb.checked = EDIT;
}

function repStatusHtml(r, labId){
  return '<div class="rep-s">'
    + '<label><input type="checkbox" ' + (r.declared ? 'checked' : '') + ' onchange="setRep(\'' + esc(labId) + '\',\'' + esc(r.id) + '\',\'declared\',this.checked)"> 已申报</label>'
    + '<label><input type="checkbox" ' + (r.fixed ? 'checked' : '') + ' onchange="setRep(\'' + esc(labId) + '\',\'' + esc(r.id) + '\',\'fixed\',this.checked)"> 已维修完毕</label>'
    + '</div>';
}
function edRep(r, labId){
  var L = "'" + esc(labId) + "','" + esc(r.id) + "'";
  return '<div class="two">'
    + '<label class="f"><span class="k">报修时间</span>'
    + '<input type="text" value="' + esc(r.time||'') + '" onchange="setRepField(' + L + ',\'time\',this.value)" placeholder="如 2026-10-15"></label>'
    + '<label class="f"><span class="k">电脑编号</span>'
    + '<input type="text" value="' + esc(r.machine||'') + '" onchange="setRepField(' + L + ',\'machine\',this.value)" placeholder="如 12号机"></label>'
    + '</div>'
    + '<div class="f"><span class="k">报修问题（可多选）</span>'
    + problemChecksHtml(repProblemsForEdit(r), 'edit', L)
    + '</div>'
    + '<label class="f" id="rpOtherWrap_' + esc(r.id) + '" style="display:'
    + (repProblemsForEdit(r).indexOf('其他') >= 0 ? 'block' : 'none') + '">'
    + '<span class="k">「其他」的具体问题</span>'
    + '<input type="text" id="rpOtherText_' + esc(r.id) + '" value="' + esc(repOtherForEdit(r))
    + '" onchange="rpSetOther(' + L + ',this.value)" placeholder="请简单描述"></label>'
    + '<div class="rep-s">'
    + '<label><input type="checkbox" ' + (r.declared?'checked':'') + ' onchange="setRepField(' + L + ',\'declared\',this.checked)"> 已申报</label>'
    + '<label><input type="checkbox" ' + (r.fixed?'checked':'') + ' onchange="setRepField(' + L + ',\'fixed\',this.checked)"> 已维修完毕</label>'
    + '</div>';
}
/* 生成一个可编辑单元格 / 普通单元格 */
function ed(sect,i,key,val,cls){
  var v = esc(val==null?'':val);
  if (EDIT){
    return '<td class="' + (cls||'') + '" contenteditable="true" data-s="' + sect + '" data-i="' + i + '" '
      + 'data-k="' + key + '" onblur="cellEdit(this)">' + v + '</td>';
  }
  return '<td class="' + (cls||'') + '">' + (v===''?'<span class="muted">·</span>':v) + '</td>';
}
/* 每行的「改 / 删」按钮。两种模式下都显示 —— 这样不必先去主页勾编辑模式。 */
function rowBtns(sect, i){
  return '<td class="rowbtns">'
    + '<button class="mini" onclick="dlgRow(\'' + sect + '\',' + i + ')" title="修改这一行">改</button>'
    + '<button class="mini delmini" onclick="delRow(\'' + sect + '\',' + i + ')" title="删除这一行">删</button>'
    + '</td>';
}

/* 单行编辑对话框。sect: hw / env / sw ；idx:-1 表示新增 */
var ROW_FIELDS = {
  hw:  [['item','项目','如 CPU'],['config','配置','如 Intel(R) Core(TM) i7-10700'],
        ['year','采购年份','如 2020'],['warranty','保修状态','如 过保'],['qty','数量','如 64台']],
  env: [['item','项目','如 操作系统'],['config','版本/配置','如 Windows10-64']],
  sw:  [['cat','类别','如 开发工具'],['name','软件名称','如 PyCharm'],
        ['ver','版本','如 2026.1'],['note','备注','（可留空）']]
};
var ROW_TITLE = { hw:'硬件配置', env:'系统环境', sw:'软件清单' };
var ROW_NEW_DEF = {
  hw:  { item:'', config:'', year:'', warranty:'', qty:'' },
  env: { item:'', config:'' },
  sw:  { cat:'', name:'', ver:'', note:'' }
};
function dlgRow(sect, idx){
  var lab = findLab(CUR);
  if (!lab) return;
  var isNew = (idx < 0);
  var row = isNew ? Object.assign({}, ROW_NEW_DEF[sect]) : lab[sect][idx];
  if (!row) return;
  var fields = ROW_FIELDS[sect];
  var html = '<h3>' + (isNew ? '添加' : '修改') + ROW_TITLE[sect] + '</h3>'
    + '<div class="st">' + esc(lab.id) + ' ' + esc(lab.name||'') + '</div>';
  fields.forEach(function(f, k){
    var key = f[0], label = f[1], ph = f[2];
    var val = row[key] == null ? '' : row[key];
    html += '<label class="f"><span class="k">' + esc(label) + '</span>'
      + '<input type="text" id="rowF' + k + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"></label>';
  });
  html += '<div class="muted">按学校台账原样填，程序不会替你改写内容。</div>'
    + '<div class="row-btns"><button class="btn" onclick="saveRow(\'' + sect + '\',' + idx + ')">'
    + (isNew ? '添加' : '保存') + '</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>';
  openDlg(html);
  setTimeout(function(){ var el = $('#rowF0'); if (el) el.focus(); }, 60);
}
function saveRow(sect, idx){
  var lab = findLab(CUR);
  if (!lab) return;
  var fields = ROW_FIELDS[sect], row = {};
  var firstEmpty = false;
  fields.forEach(function(f, k){
    var el = $('#rowF' + k);
    var v = el ? String(el.value || '').trim() : '';
    row[f[0]] = v;
  });
  /* 至少要有第一个字段（项目 / 类别） */
  if (!row[fields[0][0]]){ toast('请填「' + fields[0][1] + '」'); return; }
  if (idx < 0){
    lab[sect].push(row);
    save(); closeDlg();
    renderLab();
    toast('已添加：' + row[fields[0][0]]);
  } else {
    lab[sect][idx] = row;
    save(); closeDlg();
    renderLab();
    toast('已保存');
  }
}

function cellEdit(td){
  var lab = findLab(CUR); if (!lab) return;
  var s = td.dataset.s, i = +td.dataset.i, k = td.dataset.k;
  var val = td.innerText.replace(/\u00a0/g,' ').trim();
  if (!lab[s] || !lab[s][i]) return;
  if (lab[s][i][k] === val) return;
  lab[s][i][k] = val;
  save();
  toast('已保存');
}

function addRow(sect){
  var lab = findLab(CUR); if (!lab) return;
  if (sect==='hw')      lab.hw.push({ item:'', config:'', year:'', warranty:'', qty:'' });
  else if (sect==='env') lab.env.push({ item:'', config:'' });
  else if (sect==='sw')  lab.sw.push({ cat:'', name:'', ver:'', note:'' });
  save(); EDIT = true; renderLab();
}
function delRow(sect,i){
  var lab = findLab(CUR); if (!lab) return;
  if (!confirm('删除这一行？')) return;
  lab[sect].splice(i,1); save(); renderLab();
}
function setRep(labId, repId, key, val){
  var lab = findLab(labId); if (!lab) return;
  var r = lab.repairs.filter(function(x){ return x.id===repId; })[0];
  if (!r) return;
  r[key] = !!val;
  save(); render();
  toast(key==='declared' ? (val?'已标记为已申报':'已取消"已申报"') : (val?'已标记为维修完毕':'已取消"维修完毕"'));
}
/* 找到某条报修属于哪个实验室。
   不依赖全局 CUR —— 否则调用时机不对时会静默失败（改不动数据，还不报错）。 */
function labOfRep(repId, hintLabId){
  if (hintLabId){ var l0 = findLab(hintLabId); if (l0) return l0; }
  if (CUR){ var l1 = findLab(CUR); if (l1) return l1; }
  for (var i=0;i<DB.labs.length;i++){
    var rs = DB.labs[i].repairs || [];
    for (var j=0;j<rs.length;j++) if (rs[j].id===repId) return DB.labs[i];
  }
  return null;
}
function setRepField(repId, key, val, labId){
  var lab = labOfRep(repId, labId);
  if (!lab){ toast('没找到这条报修记录'); return; }
  var r = lab.repairs.filter(function(x){ return x.id===repId; })[0];
  if (!r){ toast('没找到这条报修记录'); return; }
  r[key] = (key==='declared'||key==='fixed') ? !!val : String(val||'').trim();
  save();
  /* 同步刷新当前页面（不管在主页还是详情页） */
  if (CUR) renderLab(); else renderHome();
  toast('已保存');
}
function delRep(labId, repId){
  var lab = findLab(labId); if (!lab) return;
  if (!confirm('删除这条报修记录？')) return;
  lab.repairs = lab.repairs.filter(function(x){ return x.id!==repId; });
  save(); renderLab(); toast('已删除');
}

   对话框
   ============================================================ */
function openDlg(html){ $('#dlg').innerHTML = html; $('#mask').classList.add('on'); }
function closeDlg(){ $('#mask').classList.remove('on'); }
$('#mask').onclick = function(e){ if (e.target.id==='mask') closeDlg(); };

function newId(){ return 'r' + Date.now() + Math.floor(Math.random()*1000); }

function dlgAddRep(labId){
  openDlg('<h3>添加报修记录</h3><div class="st">' + esc(labId) + ' 实验室</div>'
    + '<label class="f"><span class="k">报修时间</span><input type="text" id="npTime" value="' + today() + '" placeholder="如 2026-10-15"></label>'
    + '<label class="f"><span class="k">电脑编号</span><input type="text" id="npMach" placeholder="如 12号机"></label>'
    + '<div class="f"><span class="k">报修问题（可多选）</span>'
    + problemChecksHtml([], 'add')
    + '</div>'
    + '<label class="f" id="npOtherWrap" style="display:none">'
    + '<span class="k">「其他」的具体问题</span>'
    + '<input type="text" id="npOtherText" placeholder="请简单描述具体问题"></label>'
    + '<div class="rep-s" style="margin-bottom:6px">'
    + '<label><input type="checkbox" id="npDec"> 已申报</label>'
    + '<label><input type="checkbox" id="npFix"> 已维修完毕</label></div>'
    + '<div class="row-btns"><button class="btn" onclick="saveRep(\'' + esc(labId) + '\')">保存</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>');
  setTimeout(function(){ var e=$('#npMach'); if (e) e.focus(); }, 50);
}
function saveRep(labId){
  var lab = findLab(labId); if (!lab) return;
  var machine = $('#npMach').value.trim();
  if (!machine){ toast('请填电脑编号'); return; }

  /* 收集勾选的报修问题（按固定顺序） */
  var picked = [];
  Array.prototype.forEach.call(document.querySelectorAll('.rp-cb'), function(b){
    if (b.checked) picked.push(b.value);
  });
  var problems = REP_PROBLEMS.filter(function(p){ return picked.indexOf(p) >= 0; });
  if (!problems.length){ toast('请至少勾选一个报修问题'); return; }

  var otherText = '';
  if (problems.indexOf('其他') >= 0){
    var el = document.getElementById('npOtherText');
    otherText = el ? el.value.trim() : '';
    if (!otherText){ toast('勾了「其他」，请填具体问题'); return; }
  }

  lab.repairs.push({
    id: newId(),
    time: $('#npTime').value.trim() || today(),
    machine: machine,
    problems: problems,
    problemOther: otherText,
    declared: $('#npDec').checked,
    fixed: $('#npFix').checked
  });
  save(); closeDlg(); renderLab();
  toast('已添加报修记录：' + machine);
}

function dlgAddLab(){
  openDlg('<h3>新增实验室</h3><div class="st">会自动生成一份空白的配置表单</div>'
    + '<label class="f"><span class="k">实验室编号（房间号）</span><input type="text" id="nlId" placeholder="如 401"></label>'
    + '<label class="f"><span class="k">实验室名称</span><input type="text" id="nlName" placeholder="如 软件实验室"></label>'
    + '<div class="row-btns"><button class="btn" onclick="saveLab()">创建</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>');
  setTimeout(function(){ var e=$('#nlId'); if (e) e.focus(); }, 50);
}
function saveLab(){
  var id = $('#nlId').value.trim();
  var name = $('#nlName').value.trim();
  if (!id){ toast('请填实验室编号'); return; }
  if (findLab(id)){ toast('编号 ' + id + ' 已存在'); return; }
  DB.labs.push({
    id: id, name: name,
    hw: [
      { item:'CPU', config:'', year:'', warranty:'', qty:'' },
      { item:'内存', config:'', year:'', warranty:'', qty:'' },
      { item:'硬盘', config:'', year:'', warranty:'', qty:'' },
      { item:'网络', config:'', year:'', warranty:'', qty:'' }
    ],
    env: [
      { item:'操作系统', config:'' },
      { item:'还原保护', config:'' },
      { item:'网络配置', config:'' }
    ],
    sw: [],
    repairs: []
  });
  save(); closeDlg();
  DB.labs.sort(function(a,b){ return String(a.id).localeCompare(String(b.id),'zh'); });
  openLab(id);
  toast('已创建实验室 ' + id + '，去填配置吧');
}
function dlgEditLab(labId){
  var lab = findLab(labId); if (!lab) return;
  openDlg('<h3>修改实验室</h3><div class="st">修改编号可能影响你对数据的记忆，建议只改名称</div>'
    + '<label class="f"><span class="k">实验室编号</span><input type="text" id="elId" value="' + esc(lab.id) + '"></label>'
    + '<label class="f"><span class="k">实验室名称</span><input type="text" id="elName" value="' + esc(lab.name||'') + '"></label>'
    + '<div class="row-btns"><button class="btn" onclick="doEditLab(\'' + esc(labId) + '\')">保存</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>');
}
function doEditLab(oldId){
  var lab = findLab(oldId); if (!lab) return;
  var nid = $('#elId').value.trim();
  var nm = $('#elName').value.trim();
  if (!nid){ toast('编号不能为空'); return; }
  if (nid!==oldId && findLab(nid)){ toast('编号 ' + nid + ' 已存在'); return; }
  lab.id = nid; lab.name = nm;
  save(); closeDlg(); CUR = nid; render();
  toast('已保存');
}
function dlgDelLab(labId){
  var lab = findLab(labId); if (!lab) return;
  openDlg('<h3>删除实验室</h3>'
    + '<div class="alert r" style="margin:0 0 12px"><b>' + esc(lab.id) + ' ' + esc(lab.name||'') + '</b><br>'
    + '它的配置表单和 ' + (lab.repairs||[]).length + ' 条报修记录会一起删除，无法恢复。</div>'
    + '<div class="row-btns"><button class="btn danger" onclick="doDelLab(\'' + esc(labId) + '\')">确认删除</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>');
}
function doDelLab(labId){
  DB.labs = DB.labs.filter(function(l){ return l.id!==labId; });
  save(); closeDlg(); goHome(); toast('已删除实验室 ' + labId);
}

/* ============================================================
   报修记录 → 导出为 Excel（.xlsx）
   ------------------------------------------------------------
   没有用任何第三方库：.xlsx 本质是一个 ZIP，里面装几个 XML，
   这里自己拼出来，且用 ZIP 的"存储"模式（不压缩）——这样连压缩接口
   都不需要，任何浏览器都能跑。已用 openpyxl 和 WPS 双重验证可正常打开。

   排序：纯按报修时间，最新的在前。
   ============================================================ */

/* ---------- CRC32（ZIP 要求每个文件带校验值） ---------- */
var CRC_TABLE = null;
function crc32(bytes){
  if (!CRC_TABLE){
    CRC_TABLE = new Int32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[n] = c;
    }
  }
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* ---------- 极简 ZIP 打包（全部存储模式，method=0） ---------- */
function zipStore(files){
  var enc = new TextEncoder();
  var parts = [], central = [], offset = 0;

  files.forEach(function(f){
    var nameBytes = enc.encode(f.name);
    var data = f.data;
    var crc = crc32(data);

    var lh = new Uint8Array(30 + nameBytes.length);
    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034B50, true);   /* PK\x03\x04 */
    dv.setUint16(4, 20, true);           /* 解压所需版本 */
    dv.setUint16(6, 0x0800, true);       /* bit11: 文件名用 UTF-8 */
    dv.setUint16(8, 0, true);            /* 压缩方式 0 = 存储 */
    dv.setUint16(10, 0, true);           /* 时间 */
    dv.setUint16(12, 0x21, true);        /* 日期 */
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    parts.push(lh, data);

    var cd = new Uint8Array(46 + nameBytes.length);
    var dv2 = new DataView(cd.buffer);
    dv2.setUint32(0, 0x02014B50, true);  /* PK\x01\x02 */
    dv2.setUint16(4, 20, true);
    dv2.setUint16(6, 20, true);
    dv2.setUint16(8, 0x0800, true);
    dv2.setUint16(10, 0, true);
    dv2.setUint16(12, 0, true);
    dv2.setUint16(14, 0x21, true);
    dv2.setUint32(16, crc, true);
    dv2.setUint32(20, data.length, true);
    dv2.setUint32(24, data.length, true);
    dv2.setUint16(28, nameBytes.length, true);
    dv2.setUint16(30, 0, true);
    dv2.setUint16(32, 0, true);
    dv2.setUint16(34, 0, true);
    dv2.setUint16(36, 0, true);
    dv2.setUint32(38, 0, true);
    dv2.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += lh.length + data.length;
  });

  var centralStart = offset, centralSize = 0;
  central.forEach(function(c){ centralSize += c.length; });
  var eocd = new Uint8Array(22);
  var dv3 = new DataView(eocd.buffer);
  dv3.setUint32(0, 0x06054B50, true);    /* PK\x05\x06 */
  dv3.setUint16(8, files.length, true);
  dv3.setUint16(10, files.length, true);
  dv3.setUint32(12, centralSize, true);
  dv3.setUint32(16, centralStart, true);

  var all = parts.concat(central).concat([eocd]);
  var total = 0;
  all.forEach(function(x){ total += x.length; });
  var out = new Uint8Array(total), pos = 0;
  all.forEach(function(x){ out.set(x, pos); pos += x.length; });
  return out;
}

/* ---------- XML / 列名 小工具 ---------- */
function xmlEsc(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}
function colName(n){
  var t = '';
  while (n > 0){ var m = (n - 1) % 26; t = String.fromCharCode(65 + m) + t; n = Math.floor((n - 1) / 26); }
  return t;
}

/* ---------- 把二维数组写成 xlsx 字节 ---------- */
function buildXlsx(sheetName, rows, colWidths){
  var enc = new TextEncoder();
  var NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';

  var sheetRows = rows.map(function(row, ri){
    var cells = row.map(function(val, ci){
      var ref = colName(ci + 1) + (ri + 1);
      if (val == null || val === '') return '<c r="' + ref + '"/>';
      var style = ri === 0 ? ' s="1"' : '';
      var txt = String(val);
      var preserve = /(^\s|\s$)/.test(txt) ? ' xml:space="preserve"' : '';
      return '<c r="' + ref + '"' + style + ' t="inlineStr"><is><t' + preserve + '>' + xmlEsc(txt) + '</t></is></c>';
    }).join('');
    return '<row r="' + (ri + 1) + '">' + cells + '</row>';
  }).join('');

  var colsXml = '';
  if (colWidths && colWidths.length){
    colsXml = '<cols>' + colWidths.map(function(w, i){
      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    }).join('') + '</cols>';
  }

  var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<worksheet xmlns="' + NS + '">' + colsXml + '<sheetData>' + sheetRows + '</sheetData></worksheet>';

  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
    + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
    + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
    + '</Types>';

  var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + '</Relationships>';

  var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<workbook xmlns="' + NS + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
    + '<sheets><sheet name="' + xmlEsc(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';

  var wbRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
    + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    + '</Relationships>';

  /* 两种字体（常规 + 表头加粗）、两种填充（无 + 表头底色） */
  var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'
    + '<styleSheet xmlns="' + NS + '">'
    + '<fonts count="2"><font><sz val="11"/><name val="宋体"/></font><font><b/><sz val="11"/><name val="宋体"/></font></fonts>'
    + '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
    + '<fill><patternFill patternType="solid"><fgColor rgb="FFE8F0FB"/><bgColor indexed="64"/></patternFill></fill></fills>'
    + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    + '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'
    + '<cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles>'
    + '</styleSheet>';

  return zipStore([
    { name: '[Content_Types].xml',        data: enc.encode(contentTypes) },
    { name: '_rels/.rels',                data: enc.encode(rootRels) },
    { name: 'xl/workbook.xml',            data: enc.encode(workbook) },
    { name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbRels) },
    { name: 'xl/styles.xml',              data: enc.encode(styles) },
    { name: 'xl/worksheets/sheet1.xml',   data: enc.encode(sheet) }
  ]);
}

/* ---------- 报修状态文字 ---------- */
function repStateText(r){
  if (r.fixed) return '已维修完毕';
  if (r.declared) return '已申报·未维修完毕';
  return '未申报';
}

/* ---------- 报修时间排序键（yyyymmdd 数字，便于比较） ---------- */
function timeSortKey(t){
  var s = String(t == null ? '' : t).trim();
  var m = /(\d{4})\D(\d{1,2})\D(\d{1,2})/.exec(s);
  if (m) return (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]);
  var d = s.replace(/\D/g, '');
  if (d) return parseInt(d.slice(0, 8), 10) || 0;
  return 0;                                   /* 没填时间 → 排最后 */
}

/* ============================================================
   保存文件
   ------------------------------------------------------------
   浏览器出于安全限制，不允许网页直接往桌面建文件夹，
   必须由用户在一次"选择文件夹"的操作里授权。所以：
     · 优先：让用户选一个"上级文件夹"（默认停在桌面），
             程序在里面自动创建「报修记录」子目录再存进去
     · 其次：让用户选"另存为"的完整位置
     · 兜底：走浏览器普通下载（进"下载"文件夹）
   ============================================================ */
var EXPORT_DIR = null;        /* 本次会话内记住的上级目录句柄 */

function resetExportDir(){
  EXPORT_DIR = null;
  toast('已清除。下次导出时会重新让你选择保存位置');
}

function saveXlsxSmart(bytes, filename, subfolder){
  var blob = new Blob([bytes], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });

  return (async function(){
    /* ---- 路线 1：目录选择器 + 自动建子文件夹 ---- */
    if (typeof window.showDirectoryPicker === 'function'){
      try {
        var parent = EXPORT_DIR;
        if (!parent){
          parent = await window.showDirectoryPicker({
            id: 'lab-baoxiu-dir',            /* 浏览器会记住上次用的目录 */
            startIn: 'desktop',              /* 默认停在桌面 */
            mode: 'readwrite'
          });
          EXPORT_DIR = parent;
        }
        var dir = await parent.getDirectoryHandle(subfolder, { create: true });
        /* 同名文件不覆盖，自动加 (2)(3) */
        var name = filename;
        var i = 2;
        while (true){
          try { await dir.getFileHandle(name); }
          catch(e){ if (e && e.name === 'NotFoundError') break; throw e; }
          name = filename.replace(/\.xlsx$/i, '') + '(' + (i++) + ').xlsx';
        }
        var fh = await dir.getFileHandle(name, { create: true });
        var w = await fh.createWritable();
        await w.write(blob);
        await w.close();
        return { how:'folder', where: (parent.name || '所选文件夹') + '\\' + subfolder, name: name };
      } catch(e){
        if (e && e.name === 'AbortError') return { cancelled: true };
        EXPORT_DIR = null;                   /* 权限失效等 → 换路线 */
      }
    }

    /* ---- 路线 2：另存为 ---- */
    if (typeof window.showSaveFilePicker === 'function'){
      try {
        var fh2 = await window.showSaveFilePicker({
          id: 'lab-baoxiu-file',
          startIn: 'desktop',
          suggestedName: filename,
          types: [{
            description: 'Excel 工作簿',
            accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] }
          }]
        });
        var w2 = await fh2.createWritable();
        await w2.write(blob);
        await w2.close();
        return { how:'file', name: fh2.name || filename };
      } catch(e){
        if (e && e.name === 'AbortError') return { cancelled: true };
      }
    }

    /* ---- 路线 3：普通下载兜底 ---- */
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
    return { how:'download', name: filename };
  })();
}

/* ============================================================
   导出报修记录
   labId 为空 = 全部实验室汇总
   ============================================================ */
var REPAIR_HEADER = ['序号','实验室编号','实验室名称','报修时间','电脑编号','报修问题','已申报','已维修完毕','状态'];
var REPAIR_WIDTHS = [6, 11, 18, 13, 12, 36, 9, 13, 16];

async function exportRepairs(labId){
  var scope = labId || '';
  var list = [];
  DB.labs.forEach(function(lab){
    if (scope && lab.id !== scope) return;
    (lab.repairs || []).forEach(function(r){
      list.push({ lab: lab, r: r, key: timeSortKey(r.time) });
    });
  });

  if (!list.length){
    toast(scope ? ('实验室 ' + scope + ' 还没有报修记录') : '还没有任何报修记录');
    return;
  }

  /* 纯按报修时间排序：最新的在前；时间相同的按实验室编号 */
  list.sort(function(a, b){
    if (b.key !== a.key) return b.key - a.key;
    return String(a.lab.id).localeCompare(String(b.lab.id), 'zh');
  });

  var rows = [REPAIR_HEADER];
  list.forEach(function(x, i){
    var r = x.r;
    rows.push([
      String(i + 1),
      x.lab.id,
      x.lab.name || '',
      r.time || '',
      r.machine || '',
      repProblemText(r) || '',
      r.declared ? '是' : '否',
      r.fixed ? '是' : '否',
      repStateText(r)
    ]);
  });

  var bytes = buildXlsx('报修记录', rows, REPAIR_WIDTHS);
  var fname = '报修记录_' + (scope || '全部') + '_' + today() + '.xlsx';

  var res;
  try {
    res = await saveXlsxSmart(bytes, fname, '报修记录');
  } catch(e){
    toast('导出失败：' + ((e && e.message) || e));
    return;
  }
  if (res && res.cancelled){ toast('已取消导出'); return; }

  if (res.how === 'folder'){
    toast('已保存到「' + res.where + '」：' + res.name);
  } else if (res.how === 'file'){
    toast('已保存：' + res.name);
  } else {
    toast('已下载 ' + res.name + '（在浏览器的"下载"文件夹里）');
  }
}

/* ---------- ZIP ---------- */
function zipFindEOCD(dv, len){
  for (var i = len - 22; i >= 0 && i >= len - 22 - 65535; i--){
    if (dv.getUint32(i, true) === 0x06054b50) return i;
  }
  return -1;
}
function zipEntries(dv, len){
  var eocd = zipFindEOCD(dv, len);
  if (eocd < 0) throw new Error('不是有效的 xlsx（找不到 ZIP 目录）');
  var count = dv.getUint16(eocd + 10, true);
  var off = dv.getUint32(eocd + 16, true);
  var out = {}, p = off;
  for (var i = 0; i < count; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP 目录损坏');
    var method  = dv.getUint16(p + 10, true);
    var compSz  = dv.getUint32(p + 20, true);
    var nameLen = dv.getUint16(p + 28, true);
    var extraLen= dv.getUint16(p + 30, true);
    var cmtLen  = dv.getUint16(p + 32, true);
    var lho     = dv.getUint32(p + 42, true);
    var name = new TextDecoder('utf-8').decode(new Uint8Array(dv.buffer, p + 46, nameLen));
    var lNameLen = dv.getUint16(lho + 26, true);
    var lExtraLen= dv.getUint16(lho + 28, true);
    out[name] = { method:method, start: lho + 30 + lNameLen + lExtraLen, size: compSz };
    p += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}
async function zipRead(dv, e){
  if (!e) return null;
  var bytes = new Uint8Array(dv.buffer, e.start, e.size);
  if (e.method === 0) return new TextDecoder('utf-8').decode(bytes);
  if (e.method !== 8) throw new Error('不支持的压缩方式');
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

/* ---------- XML ---------- */
var NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
function colNum(letters){
  var n = 0;
  for (var i=0;i<letters.length;i++) n = n*26 + (letters.charCodeAt(i)-64);
  return n;
}
function parseSheet(xmlText, shared){
  var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('工作表 XML 解析失败');
  var sd = doc.getElementsByTagNameNS(NS_MAIN,'sheetData')[0];
  var grid = {}, maxR = 0, maxC = 0;
  if (sd){
    var rows = sd.getElementsByTagNameNS(NS_MAIN,'row');
    for (var i=0;i<rows.length;i++){
      var r = parseInt(rows[i].getAttribute('r'),10);
      if (!r) continue;
      maxR = Math.max(maxR, r);
      var cs = rows[i].getElementsByTagNameNS(NS_MAIN,'c');
      for (var j=0;j<cs.length;j++){
        var c = cs[j];
        var m = /^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')||'');
        if (!m) continue;
        var col = colNum(m[1]);
        maxC = Math.max(maxC, col);
        var t = c.getAttribute('t');
        var vN = c.getElementsByTagNameNS(NS_MAIN,'v')[0];
        var iN = c.getElementsByTagNameNS(NS_MAIN,'is')[0];
        var val = null;
        if (t==='s' && vN) val = shared[parseInt(vN.textContent,10)];
        else if (t==='inlineStr' && iN){
          var ts = iN.getElementsByTagNameNS(NS_MAIN,'t'), buf=[];
          for (var k=0;k<ts.length;k++) buf.push(ts[k].textContent);
          val = buf.join('');
        }
        else if (vN) val = vN.textContent;
        if (val!==null && val!==undefined && String(val).trim()!=='') grid[r+','+col] = String(val);
      }
    }
  }
  /* 合并单元格：把左上角的值填满整个区域（类别继承靠这一步） */
  var mc = doc.getElementsByTagNameNS(NS_MAIN,'mergeCell');
  for (var q=0;q<mc.length;q++){
    var ref = mc[q].getAttribute('ref'); if (!ref) continue;
    var pr = ref.split(':'); if (pr.length!==2) continue;
    var a = /^([A-Z]+)(\d+)$/.exec(pr[0]), b = /^([A-Z]+)(\d+)$/.exec(pr[1]);
    if (!a||!b) continue;
    var r1=+a[2], c1=colNum(a[1]), r2=+b[2], c2=colNum(b[1]);
    var top = grid[r1+','+c1];
    if (top!==undefined){
      for (var rr=r1;rr<=r2;rr++) for (var cc=c1;cc<=c2;cc++)
        if (grid[rr+','+cc]===undefined) grid[rr+','+cc] = top;
    }
    maxR = Math.max(maxR,r2); maxC = Math.max(maxC,c2);
  }
  return { grid:grid, maxR:maxR, maxC:maxC };
}

/* ---------- 把一张工作表解析成实验室 ---------- */
/* 从标题里取实验室编号（房间号）。
   配置清单的标题是「203智能科学实验室」，课表的标题是
   「江苏师范大学科文学院 潘安湖匠心楼330  教室课表」——两种都要能取到。 */
function labIdFromTitle(title, sheetName){
  var t = String(title || '');
  var m = /(\d{3,4})\s*教室/.exec(t);      /* 「…匠心楼330  教室课表」 */
  if (m) return m[1];
  m = /(?:楼|室|栋|区)[\s]*(\d{3,4})/.exec(t);
  if (m) return m[1];
  m = /^\s*(\d{3,4})/.exec(t);             /* 「203智能科学实验室」 */
  if (m) return m[1];
  m = /(\d{3,4})/.exec(t);
  if (m) return m[1];
  var sn = String(sheetName || '').trim();
  if (/^\d{3,4}$/.test(sn)) return sn;     /* 表名本身就是编号 */
  return sn || '';
}
/* 取实验室名称：配置清单标题去掉开头的编号 */
function labNameFromTitle(title){
  return String(title || '').replace(/^\s*\d{3,4}\s*/, '').trim();
}
/* 判断是不是"课程表"（而不是"配置清单"） */
function looksLikeCourseSheet(sh){
  for (var r = 1; r <= Math.min(sh.maxR, 6); r++){
    for (var c = 1; c <= Math.min(sh.maxC, 12); c++){
      var v = sh.grid[r + ',' + c];
      if (v && (String(v).indexOf('课表') >= 0 || String(v).indexOf('教室:') >= 0)) return true;
    }
  }
  return false;
}

/* 课表里每个格子的内容拆成一条条课程。
   格式（换行分隔）：
     课程名
     （空行）
     班级
     教师
      周次 周[节次]
   一个格子里可能有多门课。 */
function parseCellCourses(txt){
  var out = [];
  if (!txt) return out;
  var lines = String(txt).replace(/\r/g,'').split('\n');
  var cleaned = [];
  for (var i=0;i<lines.length;i++){
    var v = lines[i].replace(/[\u00a0\u3000]/g,' ').trim();
    if (v !== '') cleaned.push(v);
  }
  var i2 = 0;
  while (i2 < cleaned.length){
    /* 找到一条"周次+节次"行（含「周」且含「[」） */
    var start = -1;
    for (var k = i2; k < cleaned.length; k++){
      if (/周/.test(cleaned[k]) && /\[/.test(cleaned[k])){ start = k; break; }
      if (k - i2 > 3) break;
    }
    if (start < 0) break;
    var meta = cleaned[start];
    var head = cleaned.slice(i2, start);          /* 课程名 / 班级 / 教师 */
    var crs = head.length ? head[0] : '';
    var rest = head.slice(1);
    /* 末尾是教师、倒数第二是班级（更稳一点：含"班"的当班级） */
    var cls = '', tch = '';
    if (rest.length === 1){ cls = rest[0]; }
    else if (rest.length >= 2){
      tch = rest[rest.length - 1];
      cls = rest.slice(0, rest.length - 1).join(' ');
    }
    if (!cls){
      var ci = -1;
      for (var z = 0; z < head.length; z++) if (/班/.test(head[z])){ ci = z; break; }
      if (ci === 0){ crs = ''; cls = head[0]; tch = head.slice(1).join(' '); }
    }
    /* 周次与节次。注意 meta 形如 "7-14 周[01-02节]"，
       方括号里可能自带"节"字，也可能没有 —— 统一把末尾的"节"剥掉，
       显示时再补回来，避免出现 "01-02节节"。 */
    var mm = /^(.*?)周\s*\[([^\]]*)\]/.exec(meta);
    var weeks = mm ? mm[1].trim() : '';
    var periods = mm ? mm[2].trim() : '';
    if (!mm){
      mm = /\[([^\]]*)\]/.exec(meta);
      periods = mm ? mm[1].trim() : '';
      weeks = meta.replace(/\[[^\]]*\]/,'').replace(/周/g,'').trim();
    }
    periods = periods.replace(/节+$/,'').trim();
    out.push({ crs:crs, cls:cls, tch:tch, weeks:weeks, periods:periods });
    i2 = start + 1;
  }
  return out;
}

/* 大节序号统一成数字。
   课表里那一列写的是「第一大节」，直接截出来会得到汉字「一」，
   和预置数据里的数字 '1' 对不上，会导致按大节查课查不到。
   所以不论汉字还是数字，一律归成 '1'..'5' 这种字符串。 */
var BIG_CN = { '一':'1', '二':'2', '三':'3', '四':'4', '五':'5',
               '六':'6', '七':'7', '八':'8', '九':'9', '十':'10' };
function normBig(v){
  var s = String(v==null?'':v).replace(/第|大节|\s/g,'').trim();
  if (BIG_CN[s]) return BIG_CN[s];
  var d = s.replace(/\D/g,'');
  if (d) return String(parseInt(d,10));
  return s;                       /* 认不出来就原样保留，不硬猜 */
}

/* 把课表工作表读成 {id,name,courses} */
function courseSheetToLab(sheetName, sh){
  var g = sh.grid;
  function cell(r,c){ var v = g[r+','+c]; return v===undefined ? '' : String(v).trim(); }
  var title = cell(1,1);
  var id = labIdFromTitle(title, sheetName);
  var courses = [];
  var DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
  var dayOfCol = { 2:0, 3:1, 4:2, 5:3, 6:4, 7:5, 8:6 };   /* B..H = 星期一..星期日 */
  for (var r = 4; r <= sh.maxR; r++){
    var bigRaw = cell(r,1);
    if (!/大节/.test(bigRaw)) continue;
    var big = normBig(bigRaw);
    if (!big) continue;
    Object.keys(dayOfCol).forEach(function(colKey){
      var col = parseInt(colKey,10);
      var txt = cell(r,col);
      if (!txt) return;
      parseCellCourses(txt).forEach(function(cc){
        courses.push({
          day: dayOfCol[col],
          dayName: DAYS[dayOfCol[col]],
          big: big,
          crs: cc.crs, cls: cc.cls, tch: cc.tch,
          weeks: cc.weeks, periods: cc.periods
        });
      });
    });
  }
  return { id:id, name:'', title:title, courses:courses };
}

function sheetToLab(sheetName, sh){
  /* 课表 vs 配置清单 */
  if (looksLikeCourseSheet(sh)) return courseSheetToLab(sheetName, sh);

  var g = sh.grid;
  function cell(r,c){ var v = g[r+','+c]; return v===undefined ? '' : String(v).trim(); }

  /* 标题（第1行）：配置清单如「203智能科学实验室」 */
  var title = cell(1,1);
  var name = labNameFromTitle(title);
  var id = labIdFromTitle(title, sheetName);

  function findSection(keyword){
    for (var r=1;r<=sh.maxR;r++) if (cell(r,1).indexOf(keyword)>=0) return r;
    return -1;
  }

  var rHW  = findSection('硬件配置');
  var rEnv = findSection('系统环境');
  var rSW  = findSection('软件清单');

  var lab = { id:id, name:name, title:title, hw:[], env:[], sw:[], repairs:[] };

  /* --- 硬件配置：项目/配置/采购年份/保修状态/数量 --- */
  if (rHW > 0){
    var endHW = rEnv > 0 ? rEnv - 1 : sh.maxR;
    for (var r = rHW + 1; r <= endHW; r++){
      var a = cell(r,1);
      if (!a) continue;
      if (/^项目$/.test(a)) continue;                    /* 表头 */
      if (a.indexOf('、')>=0) continue;                   /* 段落标题 */
      lab.hw.push({ item:a, config:cell(r,2), year:cell(r,3), warranty:cell(r,4), qty:cell(r,5) });
    }
  }
  /* --- 系统环境：项目/版本·配置 --- */
  if (rEnv > 0){
    var endEnv = rSW > 0 ? rSW - 1 : sh.maxR;
    for (var r2 = rEnv + 1; r2 <= endEnv; r2++){
      var a2 = cell(r2,1);
      if (!a2) continue;
      if (/^项目$/.test(a2)) continue;
      if (a2.indexOf('、')>=0) continue;
      lab.env.push({ item:a2, config:cell(r2,2) });
    }
  }
  /* --- 软件清单：类别/软件名称/版本/备注（类别靠合并单元格继承） --- */
  if (rSW > 0){
    for (var r3 = rSW + 1; r3 <= sh.maxR; r3++){
      var cat = cell(r3,1), nm = cell(r3,2), ver = cell(r3,3), note = cell(r3,4);
      if (/^类别$/.test(cat)) continue;
      if (!nm && !cat) continue;
      if (!nm) continue;                                  /* 没软件名就跳过 */
      lab.sw.push({ cat:cat, name:nm, ver:ver, note:note });
    }
  }
  return lab;
}

/* ============================================================
   读旧版 .xls（OLE2 复合文档 + BIFF8 记录）
   —— 学校发的课表就是这种。浏览器里没有 Office 可用，所以自己解。
   ============================================================ */
function ole2Read(buf){
  var dv = new DataView(buf), u8 = new Uint8Array(buf);
  if (dv.getUint32(0,true) !== 0xE011CFD0 || dv.getUint32(4,true) !== 0xE11AB1A1){
    throw new Error('不是有效的 .xls 文件');
  }
  var ssz  = 1 << dv.getUint16(0x1E, true);      /* 通常 512 */
  var mssz = 1 << dv.getUint16(0x20, true);      /* 通常 64 */
  var nFat = dv.getUint32(0x2C, true);
  var dirStart = dv.getUint32(0x30, true);
  var miniCutoff = dv.getUint32(0x38, true);
  var miniFatStart = dv.getUint32(0x3C, true);
  var difatStart = dv.getUint32(0x44, true);
  var nDifat = dv.getUint32(0x48, true);
  function secOff(s){ return (s + 1) * ssz; }
  function u32(i){ return dv.getUint32(i, true); }

  /* --- 收集 FAT 扇区号 --- */
  var fatSectors = [];
  for (var i = 0; i < 109; i++){
    var s = u32(0x4C + i*4);
    if (s === 0xFFFFFFFF) break;
    fatSectors.push(s);
  }
  if (nDifat > 0 && difatStart !== 0xFFFFFFFE){
    var d = difatStart, guard = 0;
    while (d !== 0xFFFFFFFE && d !== 0xFFFFFFFF && guard++ < 10000){
      var base = secOff(d);
      var cnt = ssz/4 - 1;
      for (var j = 0; j < cnt; j++){
        var v = u32(base + j*4);
        if (v === 0xFFFFFFFF) break;
        fatSectors.push(v);
      }
      d = u32(base + ssz - 4);
    }
  }
  /* --- FAT 表 --- */
  var fat = [];
  for (var fi = 0; fi < fatSectors.length; fi++){
    var b0 = secOff(fatSectors[fi]);
    for (var k = 0; k < ssz/4; k++) fat.push(u32(b0 + k*4));
  }
  /* --- 顺着扇区链读一段连续数据 --- */
  function readChain(start, size){
    var out = new Uint8Array(size), pos = 0, s = start, guard = 0;
    while (s !== 0xFFFFFFFE && s !== 0xFFFFFFFF && pos < size && guard++ < 1000000){
      var off = secOff(s);
      var n = Math.min(ssz, size - pos);
      out.set(u8.subarray(off, off + n), pos);
      pos += n;
      s = (s < fat.length) ? fat[s] : 0xFFFFFFFE;
    }
    return out;
  }
  /* --- 目录项 --- */
  if (dirStart === 0xFFFFFFFE) throw new Error('.xls 结构异常（没有目录）');
  var dirLen = 0, ds = dirStart, guard2 = 0;
  while (ds !== 0xFFFFFFFE && ds !== 0xFFFFFFFF && guard2++ < 100000){
    dirLen += ssz; ds = (ds < fat.length) ? fat[ds] : 0xFFFFFFFE;
  }
  var dir = readChain(dirStart, dirLen);
  var ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
  var entries = [];
  for (var off2 = 0; off2 + 128 <= dirLen; off2 += 128){
    var nameLen = ddv.getUint16(off2 + 64, true);
    if (!nameLen) continue;
    var nm = '';
    for (var c = 0; c + 1 < nameLen - 2; c += 2) nm += String.fromCharCode(ddv.getUint16(off2 + c, true));
    entries.push({
      name: nm,
      type: dir[off2 + 66],
      start: ddv.getUint32(off2 + 116, true),
      size: ddv.getUint32(off2 + 120, true)
    });
  }
  var root = null, wb = null;
  for (var e = 0; e < entries.length; e++){
    if (entries[e].type === 5 && !root) root = entries[e];
    if (entries[e].type === 2 && /^(Workbook|Book)$/i.test(entries[e].name) && !wb) wb = entries[e];
  }
  if (!wb) throw new Error('.xls 里找不到工作表数据流');
  if (wb.size <= 0) throw new Error('.xls 内容为空');

  /* --- 大流：直接从 FAT 读 --- */
  if (wb.size >= miniCutoff){
    return readChain(wb.start, wb.size);
  }
  /* --- 小流：先读出"迷你流"整体，再按迷你 FAT 取 --- */
  if (!root || root.start === 0xFFFFFFFE) throw new Error('.xls 根目录缺失');
  var miniStream = readChain(root.start, root.size);
  var miniFat = [];
  var mf = miniFatStart, guard3 = 0;
  while (mf !== 0xFFFFFFFE && mf !== 0xFFFFFFFF && guard3++ < 100000){
    var mb = secOff(mf);
    for (var q = 0; q < ssz/4; q++) miniFat.push(u32(mb + q*4));
    mf = (mf < fat.length) ? fat[mf] : 0xFFFFFFFE;
  }
  var res = new Uint8Array(wb.size), pos2 = 0, ms = wb.start, guard4 = 0;
  while (ms !== 0xFFFFFFFE && ms !== 0xFFFFFFFF && pos2 < wb.size && guard4++ < 1000000){
    var mo = ms * mssz;
    var mn = Math.min(mssz, wb.size - pos2);
    if (mo + mn > miniStream.length) break;
    res.set(miniStream.subarray(mo, mo + mn), pos2);
    pos2 += mn;
    ms = (ms < miniFat.length) ? miniFat[ms] : 0xFFFFFFFE;
  }
  return res;
}

/* ---------- BIFF8 ---------- */
function biffReadSST(stream){
  var dv = new DataView(stream.buffer, stream.byteOffset, stream.byteLength);
  var n = stream.length;
  /* 先定位 SST（0x00FC），并把紧随其后的 CONTINUE 串起来 */
  var blocks = [], pos = 0;
  while (pos + 4 <= n){
    var id = dv.getUint16(pos, true), len = dv.getUint16(pos + 2, true);
    if (pos + 4 + len > n) break;
    if (id === 0x00FC){
      blocks.push(stream.subarray(pos + 4, pos + 4 + len));
      var p2 = pos + 4 + len;
      while (p2 + 4 <= n && dv.getUint16(p2, true) === 0x003C){
        var l2 = dv.getUint16(p2 + 2, true);
        if (p2 + 4 + l2 > n) break;
        blocks.push(stream.subarray(p2 + 4, p2 + 4 + l2));
        p2 += 4 + l2;
      }
      break;
    }
    pos += 4 + len;
  }
  if (!blocks.length) return [];
  var total = 0, unique = 0, cur = 0, off = 0;
  function atEnd(){ return cur >= blocks.length; }
  function curBuf(){ return blocks[cur]; }
  function avail(){ return curBuf().length - off; }
  function byteAt(i){ return curBuf()[off + i]; }
  total  = curBuf()[off] | (curBuf()[off+1]<<8) | (curBuf()[off+2]<<16) | (curBuf()[off+3]<<24);
  off += 4;
  unique = curBuf()[off] | (curBuf()[off+1]<<8) | (curBuf()[off+2]<<16) | (curBuf()[off+3]<<24);
  off += 4;

  var out = [];
  for (var si = 0; si < unique; si++){
    while (!atEnd() && avail() < 3){ cur++; off = 0; }
    if (atEnd()) break;
    var cch = curBuf()[off] | (curBuf()[off+1]<<8);
    var flags = curBuf()[off+2];
    off += 3;
    var rich = (flags & 0x08) ? 1 : 0;
    var asian = (flags & 0x04) ? 1 : 0;
    var nRuns = 0, cbExt = 0;
    if (rich){
      while (!atEnd() && avail() < 2){ cur++; off = 0; }
      nRuns = curBuf()[off] | (curBuf()[off+1]<<8); off += 2;
    }
    if (asian){
      while (!atEnd() && avail() < 4){ cur++; off = 0; }
      cbExt = curBuf()[off] | (curBuf()[off+1]<<8) | (curBuf()[off+2]<<16) | (curBuf()[off+3]<<24);
      off += 4;
    }
    var s = '', remaining = cch, compressed = !(flags & 0x01);
    while (remaining > 0){
      if (atEnd()) break;
      if (avail() <= 0){ cur++; off = 0; compressed = !(curBuf()[0] & 0x01); off = 1; continue; }
      if (compressed){
        var take = Math.min(remaining, avail());
        for (var t = 0; t < take; t++) s += String.fromCharCode(curBuf()[off + t]);
        off += take; remaining -= take;
      } else {
        var take2 = Math.min(remaining, Math.floor(avail()/2));
        if (take2 <= 0){ cur++; off = 0; compressed = !(curBuf()[0] & 0x01); off = 1; continue; }
        for (var t2 = 0; t2 < take2; t2++) s += String.fromCharCode(curBuf()[off + t2*2] | (curBuf()[off + t2*2 + 1] << 8));
        off += take2*2; remaining -= take2;
      }
    }
    /* 跳过富文本格式串与扩展区 */
    var skip = nRuns * 4 + cbExt;
    while (skip > 0 && !atEnd()){
      var canSkip = Math.min(skip, avail());
      off += canSkip; skip -= canSkip;
      if (skip > 0){ cur++; off = 0; }
    }
    out.push(s);
  }
  return out;
}

function biffSheetNames(stream){
  /* 统一用 DataView 读，避免 Uint8Array 与 DataView 混用造成偏移错位 */
  var dv = new DataView(stream.buffer, stream.byteOffset, stream.byteLength);
  var n = stream.length, pos = 0, names = [];
  while (pos + 4 <= n){
    var id = dv.getUint16(pos, true), len = dv.getUint16(pos + 2, true);
    if (pos + 4 + len > n) break;
    if (id === 0x0085){                      /* BOUNDSHEET
         记录体 d[]（d = pos+4）已用实际字节核对过：
           d[0..3] = 该表在流中的位置
           d[4]    = grbit（可见性/类型）
           d[5]    = 保留字节
           d[6]    = cch，名字字符数
           d[7]    = flags，bit0=1 表示 UTF-16LE
           d[8..]  = 名字                    */
      var cch   = dv.getUint8(pos + 4 + 6);
      var flags = dv.getUint8(pos + 4 + 7);
      var nm = '';
      if (flags & 0x01){                     /* UTF-16LE */
        for (var i = 0; i < cch; i++) nm += String.fromCharCode(dv.getUint16(pos + 4 + 8 + i*2, true));
      } else {                               /* 单字节 */
        for (var j = 0; j < cch; j++) nm += String.fromCharCode(dv.getUint8(pos + 4 + 8 + j));
      }
      names.push(nm);
    }
    pos += 4 + len;
  }
  return names;
}

/* 把 BIFF8 里的一张工作表读成和 parseSheet 一样的结果 { grid, maxR, maxC } */
function biffSheetGrid(stream, sst){
  var dv = new DataView(stream.buffer, stream.byteOffset, stream.byteLength);
  var n = stream.length;
  var grid = {}, merges = [], maxR = 0, maxC = 0;
  var pos = 0;
  while (pos + 4 <= n){
    var id = dv.getUint16(pos, true), len = dv.getUint16(pos + 2, true);
    if (pos + 4 + len > n) break;
    var d = pos + 4;

    if (id === 0x00FD){                      /* LABELSST：共享字符串索引 */
      var r = dv.getUint16(d, true), c = dv.getUint16(d + 2, true);
      var idx = dv.getUint32(d + 6, true);
      if (sst[idx] !== undefined && String(sst[idx]).trim() !== ''){
        grid[(r+1) + ',' + (c+1)] = sst[idx];
        maxR = Math.max(maxR, r+1); maxC = Math.max(maxC, c+1);
      }
    } else if (id === 0x0203){               /* NUMBER：数值 */
      var r2 = dv.getUint16(d, true), c2 = dv.getUint16(d + 2, true);
      var v = dv.getFloat64(d + 6, true);
      var sv = fmtNum(v);
      if (sv !== ''){ grid[(r2+1) + ',' + (c2+1)] = sv; maxR = Math.max(maxR, r2+1); maxC = Math.max(maxC, c2+1); }
    } else if (id === 0x027E){               /* RK：压缩数值 */
      var r3 = dv.getUint16(d, true), c3 = dv.getUint16(d + 2, true);
      var sv3 = fmtNum(rkValue(dv.getUint32(d + 6, true)));
      if (sv3 !== ''){ grid[(r3+1) + ',' + (c3+1)] = sv3; maxR = Math.max(maxR, r3+1); maxC = Math.max(maxC, c3+1); }
    } else if (id === 0x00BD){               /* MULRK：一行多个 RK */
      var r4 = dv.getUint16(d, true), c4 = dv.getUint16(d + 2, true);
      var cnt = (len - 6) / 6;
      for (var m = 0; m < cnt; m++){
        var sv4 = fmtNum(rkValue(dv.getUint32(d + 4 + m*6 + 2, true)));
        if (sv4 !== ''){
          grid[(r4+1) + ',' + (c4+m+1)] = sv4;
          maxR = Math.max(maxR, r4+1); maxC = Math.max(maxC, c4+m+1);
        }
      }
    } else if (id === 0x0204){               /* LABEL：直接内嵌字符串（旧写法） */
      var r5 = dv.getUint16(d, true), c5 = dv.getUint16(d + 2, true);
      var cch5 = dv.getUint16(d + 6, true);
      var fl5 = stream[d + 8];
      var s5 = '';
      if (fl5 & 0x01){ for (var i5=0;i5<cch5;i5++) s5 += String.fromCharCode(dv.getUint16(d+9+i5*2,true)); }
      else { for (var j5=0;j5<cch5;j5++) s5 += String.fromCharCode(stream[d+9+j5]); }
      if (s5.trim() !== ''){ grid[(r5+1) + ',' + (c5+1)] = s5; maxR = Math.max(maxR,r5+1); maxC = Math.max(maxC,c5+1); }
    } else if (id === 0x00E5){               /* MERGEDCELLS：合并区域 */
      var cnt2 = dv.getUint16(d, true);
      for (var q2 = 0; q2 < cnt2; q2++){
        var o = d + 2 + q2*8;
        if (o + 8 > pos + 4 + len) break;
        merges.push({
          r1: dv.getUint16(o, true) + 1, r2: dv.getUint16(o+2, true) + 1,
          c1: dv.getUint16(o+4, true) + 1, c2: dv.getUint16(o+6, true) + 1
        });
      }
    } else if (id === 0x000A){               /* EOF：本表结束 */
      break;
    }
    pos += 4 + len;
  }
  /* 合并单元格：左上角的值填满整个区域 */
  merges.forEach(function(mg){
    var top = grid[mg.r1 + ',' + mg.c1];
    if (top === undefined) return;
    for (var rr = mg.r1; rr <= mg.r2; rr++) for (var cc = mg.c1; cc <= mg.c2; cc++){
      if (grid[rr + ',' + cc] === undefined) grid[rr + ',' + cc] = top;
    }
    maxR = Math.max(maxR, mg.r2); maxC = Math.max(maxC, mg.c2);
  });
  return { grid: grid, maxR: maxR, maxC: maxC };
}
function fmtNum(v){
  if (v === Math.floor(v) && Math.abs(v) < 1e15) return String(Math.floor(v));
  return String(v);
}
function rkValue(rk){
  var isInt = rk & 0x02, div100 = rk & 0x01;
  var val;
  if (isInt){
    val = (rk >> 2);
    if (val & 0x20000000) val -= 0x40000000;   /* 符号扩展 */
  } else {
    var buf = new ArrayBuffer(8);
    var dvv = new DataView(buf);
    dvv.setUint32(0, 0, false);
    dvv.setUint32(4, rk & 0xFFFFFFFC, false);
    val = dvv.getFloat64(0, false);
  }
  return div100 ? val/100 : val;
}

/* 读 .xls：返回 [{name, sheet:{grid,maxR,maxC}}, ...] */
function xlsReadAll(buf){
  var stream = ole2Read(buf);
  var sst = biffReadSST(stream);
  var names = biffSheetNames(stream);
  /* 按 BOF(0x0809) 记录切出每张表的数据段 */
  var dv = new DataView(stream.buffer, stream.byteOffset, stream.byteLength);
  var n = stream.length, pos = 0, subs = [];
  while (pos + 4 <= n){
    var id = dv.getUint16(pos, true), len = dv.getUint16(pos + 2, true);
    if (pos + 4 + len > n) break;
    if (id === 0x0809) subs.push(pos);
    pos += 4 + len;
  }
  var sheets = [];
  for (var i = 0; i < subs.length; i++){
    var end = (i + 1 < subs.length) ? subs[i+1] : n;
    var sub = stream.subarray(subs[i], end);
    var g = biffSheetGrid(sub, sst);
    /* 跳过全局工作簿那个 BOF：它没有任何单元格 */
    if (g.maxR === 0 && g.maxC === 0) continue;
    sheets.push({ name: names[sheets.length] || ('工作表' + (sheets.length+1)), sheet: g });
  }
  if (!sheets.length) throw new Error('这个 .xls 里没有读到内容');
  return sheets;
}

async function handleFiles(files, targetLab){
  var box = $('#ipResult');
  if (!files || !files.length) return;
  box.innerHTML = '<div class="pick">正在读取…</div>';
  var results = [], failed = [];
  for (var i=0;i<files.length;i++){
    var f = files[i];
    try {
      var buf = await f.arrayBuffer();
      var head = new Uint8Array(buf.slice(0, 8));
      var isOle2 = head[0]===0xD0 && head[1]===0xCF && head[2]===0x11 && head[3]===0xE0;
      var isZip  = head[0]===0x50 && head[1]===0x4B;
      var sheetsHere = [];      /* [{name, sheet}] */

      if (isOle2){
        /* 旧版 .xls */
        sheetsHere = xlsReadAll(buf);
      } else if (isZip){
        /* .xlsx */
        var dv = new DataView(buf);
        var ent = zipEntries(dv, dv.byteLength);
        var shared = [];
        if (ent['xl/sharedStrings.xml']){
          var ssDoc = new DOMParser().parseFromString(await zipRead(dv, ent['xl/sharedStrings.xml']), 'application/xml');
          var si = ssDoc.getElementsByTagNameNS(NS_MAIN,'si');
          for (var s=0;s<si.length;s++){
            var ts = si[s].getElementsByTagNameNS(NS_MAIN,'t'), buf2=[];
            for (var k=0;k<ts.length;k++) buf2.push(ts[k].textContent);
            shared.push(buf2.join(''));
          }
        }
        var wbDoc = new DOMParser().parseFromString(await zipRead(dv, ent['xl/workbook.xml']), 'application/xml');
        var shNodes = wbDoc.getElementsByTagNameNS(NS_MAIN,'sheet');
        var sheetNames = [];
        for (var nn=0;nn<shNodes.length;nn++) sheetNames.push(shNodes[nn].getAttribute('name'));
        var sheetFiles = Object.keys(ent)
          .filter(function(x){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(x); })
          .sort(function(a,b){ return parseInt(a.match(/(\d+)/)[1],10) - parseInt(b.match(/(\d+)/)[1],10); });
        for (var x=0;x<sheetFiles.length;x++){
          sheetsHere.push({ name: sheetNames[x] || ('工作表'+(x+1)),
                            sheet: parseSheet(await zipRead(dv, ent[sheetFiles[x]]), shared) });
        }
      } else {
        throw new Error('这个文件既不是 .xls 也不是 .xlsx（可能是 WPS 的 .et 或其他格式）');
      }

      for (var y=0;y<sheetsHere.length;y++){
        var lab = sheetToLab(sheetsHere[y].name, sheetsHere[y].sheet);
        lab._file = f.name;
        lab._sheet = sheetsHere[y].name;
        results.push(lab);
      }
    } catch(e){
      failed.push({ file:f.name, msg:String(e && e.message || e) });
    }
  }
  drawImportPreview(results, failed, targetLab);
}

var IMPORT_PENDING = [];

      + esc(lab.name) + (exists ? '　<span class="bad">（已存在，导入会覆盖配置）</span>' : '　<span class="ok">（新实验室）</span>') + '</div>'
      + '<div class="muted" style="margin-top:5px">硬件 ' + lab.hw.length + ' 行 · 系统环境 ' + lab.env.length + ' 行 · 软件 ' + lab.sw.length + ' 个</div>'
      + '</div>';
  });
  if (results.length){
