    h += '<div class="muted" style="margin:8px 0">合计 ' + n + ' 条配置项，共 ' + IMPORT_PENDING.length + ' 个实验室。</div>';
    h += '<div class="row-btns" style="margin:0 0 8px"><button class="btn" onclick="doImport()">确认导入</button>'
       + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>';
    h += '<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">展开看导入后的内容（核对用）</summary>'
       + '<pre class="prev">' + esc(IMPORT_PENDING.map(function(l){
            return '【' + l.id + ' ' + l.name + '】\n硬件:\n' + l.hw.map(function(r){
              return '  ' + r.item + ' | ' + r.config + ' | ' + r.year + ' | ' + r.warranty + ' | ' + r.qty;
            }).join('\n') + '\n系统环境:\n' + l.env.map(function(r){
              return '  ' + r.item + ' | ' + r.config;
            }).join('\n') + '\n软件:\n' + l.sw.map(function(r){
              return '  [' + r.cat + '] ' + r.name + ' | ' + r.ver + ' | ' + r.note;
            }).join('\n');
          }).join('\n\n')) + '</pre></details>';
  }
  box.innerHTML = h;
}
function doImport(){
  if (!IMPORT_PENDING.length) return;
  var added = 0, updated = 0;
  IMPORT_PENDING.forEach(function(src){
    var exists = findLab(src.id);
    if (exists){
      exists.name = src.name || exists.name;
      exists.hw = src.hw; exists.env = src.env; exists.sw = src.sw;
      updated++;
    } else {
      DB.labs.push({ id:src.id, name:src.name, hw:src.hw, env:src.env, sw:src.sw, repairs:[] });
      added++;
    }
  });
  DB.labs.sort(function(a,b){ return String(a.id).localeCompare(String(b.id),'zh'); });
  save(); closeDlg();
  IMPORT_PENDING = [];
  CUR = null; render();
  toast('已导入：新增 ' + added + ' 个，覆盖 ' + updated + ' 个');
}


/* ============================================================
   模块二：日程表 & 状态展示
   ------------------------------------------------------------
   数据来源：学校发的课表（.xls / .xlsx），每个实验室一份。
   每条课程：{ day:0-6, big:'1'-'5', crs, cls, tch, weeks:'7-14', periods:'01-02' }
   原则：原样保留 —— weeks / periods 一律当字符串用，不规范化、不纠错。
   说明确认过的几个事实（写代码时不要"顺手改"）：
     · 大节共 5 个；小课次编号 01-02 / 03-04 / 06-07 / 08-09 / 10-11，并预留到 12
     · 中间 [05] 空着不用，且编号是对的，不许把 06 改成 05
     · 8 个实验室作息时间一致
     · 电子文件里换行是真正的换行符，不涉及"排版拆行"
   ============================================================ */

var DAY_NAMES = ['周一','周二','周三','周四','周五','周六','周日'];
var BIGS = ['1','2','3','4','5'];

/* ---------- 周次：把 "7-14" / "6,8-12,14,16" / "3" / "单周" 展开成周号集合 ---------- */
function weeksToSet(str){
  var s = String(str==null?'':str).replace(/第|周|\s/g,'');
  if (!s) return null;                                  /* 空 => 每周都有 */
  if (/单/.test(s) && !/双/.test(s)){
    var a = {}; for (var i=1;i<=30;i+=2) a[i]=1; return a;
  }
  if (/双/.test(s)){
    var b = {}; for (var j=2;j<=30;j+=2) b[j]=1; return b;
  }
  var set = {}, any = false;
  s.split(/[,，、\/]+/).forEach(function(seg){
    seg = seg.trim();
    if (!seg) return;
    var m = /^(\d+)\s*[-~—到至]\s*(\d+)$/.exec(seg);
    if (m){
      var x = +m[1], y = +m[2];
      if (x > y){ var t = x; x = y; y = t; }
      for (var k=x;k<=y;k++){ set[k]=1; any=true; }
    } else {
      var d = seg.replace(/\D/g,'');
      if (d){ set[+d]=1; any=true; }
    }
  });
  return any ? set : null;
}
/* 该课程在第 weekNo 周上不上 */
function courseInWeek(c, weekNo){
  if (!weekNo) return true;                 /* 不指定周次时全显示 */
  var set = weeksToSet(c.weeks);
  if (!set) return true;                    /* 没写周次 => 每周都有 */
  return !!set[weekNo];
}
/* ---------- 节次：判断某个大节是否落在这条课程的节次范围内 ---------- */
function periodsToNums(str){
  var out = [];
  String(str==null?'':str).replace(/节|\s/g,'').split(/[-~—到至]/).forEach(function(x){
    var d = x.replace(/\D/g,'');
    if (d !== '') out.push(parseInt(d,10));
  });
  return out;
}
function periodsForBig(big){
  /* 大节 -> 该大节包含的小课次编号（按确认的编号：01-02/03-04/06-07/08-09/10-11） */
  var table = { '1':[1,2], '2':[3,4], '3':[6,7], '4':[8,9], '5':[10,11] };
  return table[String(big)] || null;
}
function courseInBig(c, big){
  var want = periodsForBig(big);
  if (!want) return true;
  var got = periodsToNums(c.periods);
  if (!got.length) return true;             /* 没写节次 => 归属该大节 */
  /* 只要有一个小课次落在该大节里，就算这节课在这个大节上 */
  for (var i=0;i<got.length;i++) if (want.indexOf(got[i]) >= 0) return true;
  /* 节次写法超出常见范围（如 [03-04-05]）时，退化为按大节序号比对 */
  var bigNum = parseInt(String(big).replace(/\D/g,''),10);
  if (isNaN(bigNum)) return false;
  if (got.length >= 3){
    var lo = got[0], hi = got[got.length-1];
    var loBig = Math.ceil(lo/2), hiBig = Math.ceil(hi/2);
    if (bigNum >= loBig && bigNum <= hiBig) return true;
  }
  return false;
}
/* 取某实验室在某天某大节的课程（可选按周次过滤） */
function coursesAt(lab, day, big, weekNo){
  if (!lab || !lab.courses) return [];
  var out = [];
  for (var i=0;i<lab.courses.length;i++){
    var c = lab.courses[i];
    if (+c.day !== +day) continue;
    if (String(c.big) !== String(big)) continue;
    if (weekNo && !courseInWeek(c, weekNo)) continue;
    out.push(c);
  }
  return out;
}
/* 这门课是否"每节都上"（用于在顺次查询里列出全部课程） */
function labCoursesOn(lab, day, weekNo){
  if (!lab || !lab.courses) return [];
  var out = [];
  for (var i=0;i<lab.courses.length;i++){
    var c = lab.courses[i];
    if (+c.day !== +day) continue;
    if (weekNo && !courseInWeek(c, weekNo)) continue;
    out.push(c);
  }
  return out;
}

/* ---------- 日期换算 ---------- */
function pad2(n){ return (n<10?'0':'') + n; }
function dateOfWeekDay(weekNo, dayIdx){
  /* 第一周周一 + (周次-1)*7 天 + 周几偏移 */
  var fm = DB.semester && DB.semester.firstMonday;
  if (!fm || !weekNo) return null;
  var m = /^(\d{4})\D(\d{1,2})\D(\d{1,2})$/.exec(String(fm).trim());
  if (!m) return null;
  var base = new Date(+m[1], +m[2]-1, +m[3]);
  if (isNaN(base.getTime())) return null;
  var d = new Date(base.getTime());
  d.setDate(d.getDate() + (weekNo-1)*7 + dayIdx);
  return d;
}
function fmtDate(d){ return d ? (d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())) : ''; }
function todayIdx2(){ var d = new Date().getDay(); return d===0?6:d-1; }
/* 今天第几周（需要第一周周一已填） */
function weekOfToday(){
  var fm = DB.semester && DB.semester.firstMonday;
  if (!fm) return null;
  var m = /^(\d{4})\D(\d{1,2})\D(\d{1,2})$/.exec(String(fm).trim());
  if (!m) return null;
  var base = new Date(+m[1], +m[2]-1, +m[3]);
  if (isNaN(base.getTime())) return null;
  var now = new Date();
  var d0 = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  var d1 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var days = Math.round((d1 - d0) / 86400000);
  var w = Math.floor(days/7) + 1;
  return w >= 1 ? w : null;
}

/* ---------- 程表页状态 ---------- */
var TT = { week: null, day: null, inited: false };
function ttInit(){
  if (TT.inited) return;
  var w = weekOfToday();
  TT.week = w || 1;
  TT.day = todayIdx2();
  TT.inited = true;
}

/* ============================================================
   主页的"日程表"视图：第1~5大节（行） × 各实验室（列）
   ============================================================ */

      + DAY_NAMES[d] + (dt ? '<span class="d">' + (dt.getMonth()+1) + '/' + dt.getDate() + '</span>' : '') + '</button>';
  }
  h += '</div>';

  if (!DB.semester || !DB.semester.firstMonday){
    h += '<div class="muted" style="margin:2px 0 10px">还没填「本学期第一周周一」的日期，所以看不到对应日期。'
      + ' <a href="javascript:dlgSemester()" style="color:var(--blue)">现在填一下</a></div>';
  }

  /* 矩阵：列 = 实验室，行 = 大节 */

      + '<span class="no">' + esc(lab.id) + '</span>'
      + (lab.name ? '<span class="nm">' + esc(lab.name) + '</span>' : '')
      + '</th>';
  });
  h += '</tr></thead><tbody>';

                + '<div class="c3">' + esc(c.weeks) + '周[' + esc(c.periods) + '节]</div>'
                + '</div>';
            }).join('')
          + '</td>';
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="legend"><span><i class="li"></i>空着（可借用）</span><span><i class="ib"></i>有课</span>'
     + '<span class="muted">表头可按住左右拖动，调整实验室顺序</span></div>';

  if (noSched.length){

      + noSched.map(function(l){ return '<b>' + esc(l.id) + '</b> ' + esc(l.name||''); }).join('　')
      + '<div class="muted" style="margin-top:6px">进该实验室 → 课表 → 导入课表文件，或手工添加</div></div>';
  }
  h += '</div>';
  return h;
}
function ttSetWeek(v){
  var n = parseInt(v,10);
  if (isNaN(n) || n < 1) n = 1;
  if (n > 30) n = 30;
  TT.week = n;
  render();
}
function ttStepWeek(delta){ ttSetWeek((TT.week||1) + delta); }
function ttSetDay(d){ TT.day = d; render(); window.scrollTo(0,0); }

/* 点某一格：看这节课的详情 */
function showCell(labId, day, big){

          + '<div class="cd-l"><b>教师</b>' + esc(c.tch || '（未填）') + '</div>'
          + '<div class="cd-l"><b>周次</b>' + esc(c.weeks) + ' 周</div>'

/* ---------- 表头拖动排序 ---------- */
var DRAG_FROM = -1;
document.addEventListener('dragstart', function(e){
  var th = e.target.closest ? e.target.closest('th.labcol') : null;
  if (!th) return;
  DRAG_FROM = +th.dataset.idx;
  th.classList.add('dragging');
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(DRAG_FROM)); } catch(err){}
});
document.addEventListener('dragover', function(e){
  var th = e.target.closest ? e.target.closest('th.labcol') : null;
  if (th && DRAG_FROM >= 0){ e.preventDefault(); th.classList.add('dropzone'); }
});
document.addEventListener('dragleave', function(e){
  var th = e.target.closest ? e.target.closest('th.labcol') : null;
  if (th) th.classList.remove('dropzone');
});
document.addEventListener('drop', function(e){
  var th = e.target.closest ? e.target.closest('th.labcol') : null;
  if (!th || DRAG_FROM < 0) return;
  e.preventDefault();
  var to = +th.dataset.idx;
  th.classList.remove('dropzone');
  if (to !== DRAG_FROM && !isNaN(to)){
    var moved = DB.labs.splice(DRAG_FROM, 1)[0];
    DB.labs.splice(to, 0, moved);
    save();
    render();
    toast('已调整 ' + moved.id + ' 的位置');
  }
  DRAG_FROM = -1;
});
document.addEventListener('dragend', function(){
  DRAG_FROM = -1;
  Array.prototype.forEach.call(document.querySelectorAll('.dragging'), function(x){ x.classList.remove('dragging'); });
});

/* ---------- 填"本学期第一周周一" ---------- */
function dlgSemester(){
  var cur = (DB.semester && DB.semester.firstMonday) || '';
  openDlg('<h3>本学期第一周周一</h3>'
    + '<div class="st">填一次就行。之后选"第几周周几"会自动显示对应日期。</div>'
    + '<label class="f"><span class="k">日期</span>'
    + '<input type="text" id="semDate" value="' + esc(cur) + '" placeholder="如 2026-09-01"></label>'
    + '<div class="muted">写成 2026-09-01 或 2026/9/1 都可以。</div>'
    + '<div class="row-btns"><button class="btn" onclick="saveSemester()">保存</button>'
    + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>');

}
function saveSemester(){
  var v = ($('#semDate').value || '').trim();
  if (v && !/^\d{4}\D\d{1,2}\D\d{1,2}$/.test(v)){ toast('日期格式看不懂，请写成 2026-09-01'); return; }
  DB.semester = { firstMonday: v };
  save(); closeDlg();
  if (CUR) renderLab(); else render();
  toast(v ? '已保存，日期会自动换算' : '已清空日期');
}

/* ============================================================
   单个实验室的课表视图（复现学校那张纸：星期一~日 × 五大节）
   ============================================================ */
function renderLabSchedule(lab){
  var h = '';
  var week = TT.week || 1;
  var noData = !(lab.courses && lab.courses.length);

  h += '<div class="card"><h2>课表<span class="hint">' + (lab.courses ? lab.courses.length : 0) + ' 条课程</span></h2>';

  h += '<div class="mx-ctl">'
    + '<span class="lb">周次</span>'
    + '<button class="step" onclick="ttStepWeek(-1)">−</button>'
    + '<input type="number" min="1" max="30" value="' + week + '" onchange="ttSetWeek(this.value)">'
    + '<button class="step" onclick="ttStepWeek(1)">+</button>'
    + '<span class="lb" style="margin-left:6px">周</span>'
    + (weekOfToday() ? '<button class="btn sm ghost" onclick="ttSetWeek(' + weekOfToday() + ');ttSetDay(' + todayIdx2() + ')">回到本周</button>' : '')
    + '</div>';

  if (noData){
    h += '<div class="empty" style="padding:22px">这个实验室还没有课表数据<br>'
       + '<span class="muted">用下面的「导入课表文件」，或手工添加</span></div>'
       + '<div class="row-btns"><button class="btn" onclick="dlgImportCourse(\'' + esc(lab.id) + '\')">导入课表文件</button>'
       + '<button class="btn ghost" onclick="dlgAddCourse(\'' + esc(lab.id) + '\')">手工添加一门课</button></div>';
    h += '</div>';
    return h;
  }

  h += '<div class="mx-wrap"><table class="mx sched"><thead><tr><th class="corner">大节</th>';
  DAY_NAMES.forEach(function(dn, di){
    var dt = dateOfWeekDay(week, di);
    h += '<th class="' + (dt && dt.getDay() === new Date().getDay() && week === weekOfToday() ? 'today' : '') + '">'
      + dn + (dt ? '<span class="d">' + (dt.getMonth()+1) + '/' + dt.getDate() + '</span>' : '') + '</th>';
  });
  h += '</tr></thead><tbody>';

  BIGS.forEach(function(big){
    h += '<tr><th class="rowh">第' + big + '大节</th>';
    for (var di=0; di<7; di++){
      var cs = coursesAt(lab, di, big, week);
      if (!cs.length){
        h += '<td class="cell free"><span class="free-t">空</span></td>';
      } else {
        h += '<td class="cell busy">'
          + cs.map(function(c){
              return '<div class="one">'
                + '<div class="c1">' + esc(c.crs) + '</div>'
                + '<div class="c2">' + esc(c.cls) + (c.tch ? ' · ' + esc(c.tch) : '') + '</div>'
                + '<div class="c3">' + esc(c.weeks) + '周[' + esc(c.periods) + '节]</div>'
                + '</div>';
            }).join('')
          + '</td>';
      }
    }
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="legend"><span><i class="li"></i>空</span><span><i class="ib"></i>有课</span></div>';
  h += '<div class="row-btns">'
     + '<button class="btn ghost sm" onclick="dlgImportCourse(\'' + esc(lab.id) + '\')">导入课表文件（覆盖本实验室课表）</button>'
     + '<button class="btn ghost sm" onclick="dlgAddCourse(\'' + esc(lab.id) + '\')">手工添加一门课</button>'
     + '<button class="btn ghost sm" onclick="dlgListCourses(\'' + esc(lab.id) + '\')">查看/删除全部课程</button>'
     + '</div>';
  h += '</div>';
  return h;
}

function delCourse(labId, idx){
  var lab = findLab(labId);

  var c = lab.courses[idx];

  if (!confirm('删除这门课？\n' + c.crs + ' ' + DAY_NAMES[c.day] + ' 第' + c.big + '大节')) return;
  lab.courses.splice(idx, 1);
  save();
  closeDlg();
  if (CUR) renderLab(); else render();
  toast('已删除');
}

function saveCourse(labId){
  var lab = findLab(labId);
  if (!lab) return;
  var crs = ($('#ncCrs').value || '').trim();
  if (!crs){ toast('请填课程名称'); return; }
  if (!lab.courses) lab.courses = [];
  lab.courses.push({
    day: +$('#ncDay').value,
    big: $('#ncBig').value,
    crs: crs,
    cls: ($('#ncCls').value || '').trim(),
    tch: ($('#ncTch').value || '').trim(),
    weeks: ($('#ncWeeks').value || '').trim(),
    periods: ($('#ncPer').value || '').trim()
  });

  if (CUR) renderLab(); else render();

}

/* 导入课表文件（覆盖某实验室的课表） */
var IMPORT_TARGET = '';      /* 导入目标实验室；空 = 由标题自动识别 */
function dlgImportCourse(labId){
  IMPORT_TARGET = labId || '';
  /* 注意：labId 允许为空 —— 日程总表上的入口就是"哪个实验室都行，按标题认"。
     以前这里写了 if(!lab) return，导致那个按钮点了没反应。 */
  var lab = IMPORT_TARGET ? findLab(IMPORT_TARGET) : null;
  openDlg('<h3>导入课表文件</h3>'
    + '<div class="st">'
    + (lab ? esc(lab.id) + ' ' + esc(lab.name||'') + '　导入会覆盖该实验室现有课表。<br>'
           : '可一次选多个文件。程序按标题里的房间号认实验室。<br>')
    + '支持 .xls 和 .xlsx。</div>'
    + '<label class="filebox"><div class="fi">📄</div>'
    + '<div class="ft">点这里选择课表文件</div>'
    + '<div class="fs">支持 .xls 和 .xlsx，可一次选多个</div>'
    + '<input type="file" id="icFile" accept=".xls,.xlsx" multiple></label>'
    + '<div id="icResult"></div>'
    + '<div class="row-btns"><button class="btn ghost" onclick="closeDlg()">关闭</button></div>');
  $('#icFile').onchange = function(e){ handleCourseFiles(e.target.files, IMPORT_TARGET); };
}

var COURSE_PENDING = [];
async function handleCourseFiles(files, targetLab){
  var box = $('#icResult');
  if (!files || !files.length) return;
  box.innerHTML = '<div class="pick">正在读取…</div>';
  var found = [], failed = [];
  for (var i=0;i<files.length;i++){
    var f = files[i];
    try {
      var buf = await f.arrayBuffer();
      var head = new Uint8Array(buf.slice(0,8));
      var isOle2 = head[0]===0xD0 && head[1]===0xCF && head[2]===0x11 && head[3]===0xE0;
      var isZip  = head[0]===0x50 && head[1]===0x4B;
      var sheetsHere = [];
      if (isOle2){
        sheetsHere = xlsReadAll(buf);
      } else if (isZip){
        var dv = new DataView(buf);
        var ent = zipEntries(dv, dv.byteLength);
        var shared = [];
        if (ent['xl/sharedStrings.xml']){
          var ssDoc = new DOMParser().parseFromString(await zipRead(dv, ent['xl/sharedStrings.xml']), 'application/xml');
          var si = ssDoc.getElementsByTagNameNS(NS_MAIN,'si');
          for (var s=0;s<si.length;s++){
            var ts = si[s].getElementsByTagNameNS(NS_MAIN,'t'), b2=[];
            for (var k=0;k<ts.length;k++) b2.push(ts[k].textContent);
            shared.push(b2.join(''));
          }
        }
        var wbDoc = new DOMParser().parseFromString(await zipRead(dv, ent['xl/workbook.xml']), 'application/xml');
        var shNodes = wbDoc.getElementsByTagNameNS(NS_MAIN,'sheet');
        var sNames = [];
        for (var nn=0;nn<shNodes.length;nn++) sNames.push(shNodes[nn].getAttribute('name'));
        var sFiles = Object.keys(ent).filter(function(x){ return /^xl\/worksheets\/sheet\d+\.xml$/.test(x); })
          .sort(function(a,b){ return parseInt(a.match(/(\d+)/)[1],10) - parseInt(b.match(/(\d+)/)[1],10); });
        for (var x=0;x<sFiles.length;x++){
          sheetsHere.push({ name: sNames[x] || ('工作表'+(x+1)), sheet: parseSheet(await zipRead(dv, ent[sFiles[x]]), shared) });
        }
      } else {
        throw new Error('这个文件既不是 .xls 也不是 .xlsx');
      }
      sheetsHere.forEach(function(sh){
        if (!looksLikeCourseSheet(sh.sheet)) return;      /* 只处理课表 */
        var got = courseSheetToLab(sh.name, sh.sheet);
        got._file = f.name;
        found.push(got);
      });
    } catch(e){
      failed.push({ file:f.name, msg:String(e && e.message || e) });
    }
  }
  drawCoursePreview(found, failed, targetLab);
}
function drawCoursePreview(found, failed, targetLab){
  COURSE_PENDING = found;
  var box = $('#icResult');
  var h = '';
  failed.forEach(function(x){
    h += '<div class="pick"><span class="bad">✗ ' + esc(x.file) + '</span><br><span class="muted">' + esc(x.msg) + '</span></div>';
  });
  if (!found.length && !failed.length){
    h += '<div class="pick">没有在这些文件里找到课表（要含"教室课表"或"教室:"的那种表）</div>';
  }
  found.forEach(function(g){
    var exist = findLab(g.id);
    h += '<div class="pick">'
      + '<div><span class="ok">✓</span> 实验室 <b>' + esc(g.id) + '</b>　识别到 <b>' + g.courses.length + '</b> 条课程'
      + (exist ? '' : '　<span class="bad">（程序里还没有这个实验室，会新建）</span>') + '</div>'
      + '<div class="muted" style="margin-top:4px">' + esc(g.title || '') + '</div>'
      + '<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">展开核对课程内容</summary>'
      + '<pre class="prev">' + esc(g.courses.map(function(c){
            return DAY_NAMES[c.day] + ' 第' + c.big + '大节 | ' + c.crs + ' | ' + c.cls
                 + ' | ' + c.tch + ' | ' + c.weeks + '周[' + c.periods + '节]';
          }).join('\n')) + '</pre></details>'
      + '</div>';
  });
  if (found.length){
    h += '<div class="row-btns" style="margin-top:4px">'
       + '<button class="btn" onclick="doImportCourses()">确认导入（覆盖这些实验室的课表）</button>'
       + '<button class="btn ghost" onclick="closeDlg()">取消</button></div>';
  }
  box.innerHTML = h;
}
function doImportCourses(){
  if (!COURSE_PENDING.length) return;
  var added = 0, updated = 0;
  COURSE_PENDING.forEach(function(g){
    var lab = findLab(g.id);
    if (lab){
      lab.courses = g.courses;
      if (!lab.name && !g.name) { /* 名称留空，由老师自己填 */ }
      updated++;
    } else {
      DB.labs.push({ id:g.id, name:'', hw:[], env:[], sw:[], courses:g.courses, repairs:[] });
      added++;
    }
  });
  save(); closeDlg();
  COURSE_PENDING = [];
  TT.inited = false; ttInit();
  if (CUR) renderLab(); else render();
  toast('课表已导入：新建 ' + added + ' 个实验室，覆盖 ' + updated + ' 个');
}

/* ============================================================
   启动
   ============================================================ */
(function init(){
  var saved = load();
  if (saved){ DB = saved; }
  else { DB = seedData(); save(); }
  /* 补全字段，防止旧数据缺项 */
  DB.labs.forEach(function(l){
    if (!l.hw) l.hw = [];
    if (!l.env) l.env = [];
    if (!l.sw) l.sw = [];
    if (!l.repairs) l.repairs = [];
    if (!l.courses) l.courses = [];
  });
  if (!DB.semester) DB.semester = { firstMonday: '' };
  render();
})();
</script>
